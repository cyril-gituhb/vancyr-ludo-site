            <!-- PROFILE MODAL -->

    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.data('kelvinSoft', () => ({
                session: null, activeTab: 'chats', activeChat: null, showProfile: false,
                mode: 'login', profile: null, chatList: [], universities: [],
                stories: [], secrets: [], messages: [], newMessage: '',
                form: { name: '', email: '', password: '', phone: '' },
                userCoords: null,

                async init() {
                    const { data } = await sb.auth.getSession();
                    this.session = data.session;
                    this.fetchUniversities();
                    this.fetchSecrets();
                    this.fetchStories();
                    if (this.session) {
                        await this.loadProfile();
                        this.getGPS();
                        this.fetchChats();
                        this.listen();
                        // Update online status every minute
                        setInterval(() => this.updateOnlineStatus(), 60000);
                    }
                },

                async handleAuth() {
                    try {
                        if (this.mode === 'signup') {
                            const { data, error } = await sb.auth.signUp({ email: this.form.email, password: this.form.password });
                            if (error) throw error;
                            await sb.from('profiles').update({ full_name: this.form.name, phone: this.form.phone }).eq('id', data.user.id);
                            alert("Vérifie ton email !");
                        } else {
                            await sb.auth.signInWithPassword({ email: this.form.email, password: this.form.password });
                            location.reload();
                        }
                    } catch (e) { alert(e.message); }
                },

                async loadProfile() {
                    const { data } = await sb.from('profiles').select('*').eq('id', this.session.user.id).single();
                    this.profile = data;
                },

                async fetchUniversities() {
                    const { data } = await sb.from('universities').select('*');
                    this.universities = data || [];
                },

                async fetchSecrets() {
                    const { data } = await sb.from('secrets').select('*').order('created_at', { ascending: false });
                    this.secrets = data || [];
                },

                async fetchStories() {
                    const { data } = await sb.from('stories').select('*').order('created_at', { ascending: false });
                    this.stories = data || [];
                },

                async fetchChats() {
                    const { data } = await sb.from('profiles').select('*').neq('id', this.session.user.id);
                    this.chatList = data.map(u => ({
                        ...u,
                        distance: this.calcDist(this.profile.latitude, this.profile.longitude, u.latitude, u.longitude).toFixed(1),
                        is_online: (new Date() - new Date(u.last_seen)) < 300000, // En ligne si vu il y a < 5min
                        last_seen_formatted: 'Vu ' + new Date(u.last_seen).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})
                    }));
                },

                calcDist(lat1, lon1, lat2, lon2) {
                    if (!lat1 || !lat2) return 0;
                    const R = 6371;
                    const dLat = (lat2-lat1) * Math.PI/180;
                    const dLon = (lon2-lon1) * Math.PI/180;
                    const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLon/2)*Math.sin(dLon/2);
                    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
                },

                async updateOnlineStatus() {
                    await sb.from('profiles').update({ last_seen: new Date() }).eq('id', this.session.user.id);
                },

                getGPS() {
                    navigator.geolocation.getCurrentPosition(async (p) => {
                        await sb.from('profiles').update({ 
                            latitude: p.coords.latitude, 
                            longitude: p.coords.longitude,
                            last_seen: new Date() 
                        }).eq('id', this.session.user.id);
                    });
                },

                async openChat(user) {
                    this.activeChat = user;
                    const { data } = await sb.from('messages')
                        .select('*')
                        .or(`and(sender_id.eq.${this.session.user.id},receiver_id.eq.${user.id}),and(sender_id.eq.${user.id},receiver_id.eq.${this.session.user.id})`)
                        .order('created_at');
                    this.messages = data || [];
                },

                async sendMessage() {
                    if (!this.newMessage) return;
                    await sb.from('messages').insert({ sender_id: this.session.user.id, receiver_id: this.activeChat.id, content: this.newMessage });
                    this.newMessage = '';
                    this.openChat(this.activeChat);
                },

                listen() {
                    sb.channel('global').on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, () => {
                        if(this.activeChat) this.openChat(this.activeChat);
                    }).subscribe(
