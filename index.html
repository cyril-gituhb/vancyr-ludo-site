<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kelvin Loving | Campus Connect</title>
    
    <!-- Scripts avec chargement prioritaire -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">

    <script>
        // CONFIGURATION SUPABASE SÉCURISÉE
        const SUPABASE_URL = 'https://oemqhxmmoxykrqqhwnqq.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9lbXFoeG1tb3h5a3JxcWh3bnFxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU3OTM3MzksImV4cCI6MjEwMTM2OTczOX0.F7lVdMft0gQEyGiQYrnE5BMaTcu3nxMQa8D1CX0icbQ';
        
        // On déclare la variable globale pour le client
        let sbClient;

        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        wa: { dark: '#0b141a', light: '#121b22', yellow: '#fedd02', gray: '#8696a0' }
                    }
                }
            }
        }
    </script>

    <style>
        [x-cloak] { display: none !important; }
        body { background-color: #0b141a; color: white; font-family: 'Outfit', sans-serif; margin: 0; padding: 0; }
        .chat-pattern { 
            background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png'); 
            background-repeat: repeat; opacity: 0.05; position: absolute; inset: 0; pointer-events: none;
        }
        .tab-active { color: #fedd02; border-bottom: 3px solid #fedd02; }
    </style>
</head>
<body>

    <!-- Message de chargement si Alpine met du temps -->
    <div id="loader" style="position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #0b141a; z-index: 9999;">
        <iconify-icon icon="line-md:loading-twotone-loop" style="color: #fedd02; font-size: 50px;"></iconify-icon>
    </div>

    <div x-data="kelvinApp" x-cloak>
        
        <!-- 1. ÉCRAN CONNEXION -->
        <template x-if="!session">
            <div class="h-screen w-full flex flex-col items-center justify-center p-8">
                <div class="w-20 h-20 bg-wa-yellow rounded-3xl mb-8 flex items-center justify-center shadow-2xl">
                    <iconify-icon icon="solar:heart-bold" class="text-wa-dark text-5xl"></iconify-icon>
                </div>
                <h1 class="text-4xl font-black mb-10">Kelvin Loving</h1>
                <div class="w-full max-w-sm space-y-4">
                    <template x-if="mode === 'signup'">
                        <div class="space-y-4">
                            <input type="text" x-model="form.name" placeholder="Nom Complet" class="w-full p-4 bg-wa-light rounded-2xl border-none outline-none focus:ring-2 ring-wa-yellow text-white">
                            <select x-model="form.university" class="w-full p-4 bg-wa-light rounded-2xl border-none outline-none focus:ring-2 ring-wa-yellow text-white">
                                <option value="">Choisir ton université...</option>
                                <template x-for="uni in universitiesList" :key="uni.id">
                                    <option :value="uni.name" x-text="uni.name"></option>
                                </template>
                            </select>
                        </div>
                    </template>
                    <input type="email" x-model="form.email" placeholder="Email" class="w-full p-4 bg-wa-light rounded-2xl border-none outline-none">
                    <input type="password" x-model="form.password" placeholder="Mot de passe" class="w-full p-4 bg-wa-light rounded-2xl border-none outline-none">
                    <button @click="handleAuth" class="w-full bg-wa-yellow text-wa-dark font-black py-4 rounded-2xl">
                        <span x-text="mode === 'signup' ? 'S\'INSCRIRE' : 'SE CONNECTER'"></span>
                    </button>
                    <button @click="mode = (mode === 'signup' ? 'login' : 'signup')" class="w-full text-wa-gray text-xs font-bold uppercase mt-4">
                        <span x-text="mode === 'signup' ? 'Déjà inscrit ? Connexion' : 'Pas de compte ? Inscription'"></span>
                    </button>
                </div>
            </div>
        </template>

        <!-- 2. INTERFACE WHATSAPP -->
        <template x-if="session">
            <div class="h-screen flex flex-col">
                <header class="p-4 flex justify-between items-center bg-wa-dark border-b border-white/5">
                    <h1 class="text-2xl font-black text-wa-yellow italic">WhatsApp</h1>
                    <div class="flex gap-4 text-wa-gray">
                        <iconify-icon icon="solar:camera-bold" width="24"></iconify-icon>
                        <iconify-icon icon="solar:magnifer-bold" width="24"></iconify-icon>
                        <button @click="signOut"><iconify-icon icon="solar:logout-bold" width="24"></iconify-icon></button>
                    </div>
                </header>

                <!-- Tabs Navigation -->
                <div class="flex bg-wa-dark border-b border-white/5">
                    <button @click="activeTab = 'chats'" class="flex-1 py-3 text-center text-sm font-bold" :class="activeTab === 'chats' ? 'tab-active' : 'text-wa-gray'">Discussions</button>
                    <button @click="activeTab = 'actus'" class="flex-1 py-3 text-center text-sm font-bold" :class="activeTab === 'actus' ? 'tab-active' : 'text-wa-gray'">Actus</button>
                    <button @click="activeTab = 'campus'" class="flex-1 py-3 text-center text-sm font-bold" :class="activeTab === 'campus' ? 'tab-active' : 'text-wa-gray'">Campus</button>
                    <button @click="activeTab = 'confessions'" class="flex-1 py-3 text-center text-sm font-bold" :class="activeTab === 'confessions' ? 'tab-active' : 'text-wa-gray'">Secrets</button>
                </div>

                <main class="flex-1 overflow-y-auto pb-20">
                    <!-- Liste Campus -->
                    <div x-show="activeTab === 'campus'">
                        <template x-if="!selectedUni">
                            <div class="divide-y divide-white/5">
                                <template x-for="uni in universitiesList" :key="uni.id">
                                    <div @click="fetchStudents(uni)" class="p-4 flex items-center gap-4 hover:bg-wa-light">
                                        <div class="w-12 h-12 bg-wa-yellow/10 rounded-xl flex items-center justify-center text-wa-yellow text-2xl">🏛️</div>
                                        <div>
                                            <p class="font-bold text-sm" x-text="uni.name"></p>
                                            <p class="text-[10px] text-wa-gray uppercase" x-text="uni.city"></p>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </template>
                        <template x-if="selectedUni">
                            <div>
                                <div class="p-4 bg-wa-light flex items-center gap-4">
                                    <button @click="selectedUni = null"><iconify-icon icon="solar:arrow-left-bold" width="24" class="text-wa-yellow"></iconify-icon></button>
                                    <span class="font-bold text-sm" x-text="selectedUni.name"></span>
                                </div>
                                <template x-for="stu in studentsOfUni" :key="stu.id">
                                    <div @click="openChat(stu)" class="p-4 flex items-center gap-4 hover:bg-wa-light border-b border-white/5">
                                        <div class="w-12 h-12 bg-wa-dark rounded-full border border-wa-yellow flex items-center justify-center">🎓</div>
                                        <p class="font-bold flex-1" x-text="stu.full_name"></p>
                                        <iconify-icon icon="solar:chat-round-dots-bold" class="text-wa-gray"></iconify-icon>
                                    </div>
                                </template>
                            </div>
                        </template>
                    </div>
                    
                    <!-- Discussions -->
                    <div x-show="activeTab === 'chats'">
                        <template x-for="chat in chatList" :key="chat.id">
                            <div @click="openChat(chat)" class="p-4 flex items-center gap-4 hover:bg-wa-light">
                                <div class="w-14 h-14 bg-wa-light rounded-full border border-wa-yellow/20 flex items-center justify-center text-2xl">👤</div>
                                <div class="flex-1 border-b border-white/5 pb-4">
                                    <div class="flex justify-between"><p class="font-bold" x-text="chat.full_name"></p><span class="text-[10px] text-wa-gray">10:00</span></div>
                                    <p class="text-sm text-wa-gray truncate" x-text="chat.university"></p>
                                </div>
                            </div>
                        </template>
                    </div>
                </main>

                <!-- Navigation Bas -->
                <nav class="fixed bottom-0 w-full bg-wa-dark border-t border-white/5 flex justify-around p-2">
                    <button @click="activeTab = 'chats'" class="flex flex-col items-center p-2" :class="activeTab === 'chats' ? 'text-wa-yellow' : 'text-wa-gray'">
                        <iconify-icon icon="solar:chat-round-dots-bold" width="24"></iconify-icon>
                        <span class="text-[10px] font-bold">Chats</span>
                    </button>
                    <button @click="activeTab = 'actus'" class="flex flex-col items-center p-2" :class="activeTab === 'actus' ? 'text-wa-yellow' : 'text-wa-gray'">
                        <iconify-icon icon="solar:star-circle-bold" width="24"></iconify-icon>
                        <span class="text-[10px] font-bold">Actus</span>
                    </button>
                    <button @click="activeTab = 'campus'" class="flex flex-col items-center p-2" :class="activeTab === 'campus' ? 'text-wa-yellow' : 'text-wa-gray'">
                        <iconify-icon icon="solar:users-group-rounded-bold" width="24"></iconify-icon>
                        <span class="text-[10px] font-bold">Campus</span>
                    </button>
                    <button @click="activeTab = 'confessions'" class="flex flex-col items-center p-2" :class="activeTab === 'confessions' ? 'text-wa-yellow' : 'text-wa-gray'">
                        <iconify-icon icon="solar:mask-happly-bold" width="24"></iconify-icon>
                        <span class="text-[10px] font-bold">Secrets</span>
                    </button>
                </nav>

                <!-- Fenêtre Chat -->
                <div x-show="activeChat" x-cloak class="fixed inset-0 bg-wa-dark z-[100] flex flex-col">
                    <header class="p-4 bg-wa-light flex items-center gap-4">
                        <button @click="activeChat = null"><iconify-icon icon="solar:arrow-left-bold" width="24" class="text-wa-yellow"></iconify-icon></button>
                        <div class="w-10 h-10 bg-wa-dark rounded-full border border-wa-yellow flex items-center justify-center">🎓</div>
                        <div class="flex-1"><p class="font-bold" x-text="activeChat?.full_name"></p><p class="text-[10px] text-green-500 font-bold">en ligne</p></div>
                    </header>
                    <div class="flex-1 chat-pattern relative overflow-y-auto p-4 flex flex-col gap-2" id="chat-box">
                        <template x-for="m in messages" :key="m.id">
                            <div class="flex" :class="m.sender_id === session.user.id ? 'justify-end' : 'justify-start'">
                                <div class="p-3 rounded-2xl max-w-[80%] text-sm" :class="m.sender_id === session.user.id ? 'bg-wa-yellow text-wa-dark rounded-tr-none' : 'bg-wa-light text-white rounded-tl-none'">
                                    <span x-text="m.content"></span>
                                </div>
                            </div>
                        </template>
                    </div>
                    <div class="p-4 bg-wa-dark flex gap-2">
                        <input type="text" x-model="newMessage" @keyup.enter="sendMessage" placeholder="Message" class="flex-1 bg-wa-light p-3 rounded-full outline-none text-sm">
                        <button @click="sendMessage" class="w-12 h-12 bg-wa-yellow text-wa-dark rounded-full flex items-center justify-center shadow-lg"><iconify-icon icon="solar:paper-plane-bold" width="24"></iconify-icon></button>
                    </div>
                </div>

            </div>
        </template>
    </div>

    <script>
        document.addEventListener('alpine:init', () => {
            // Initialisation Supabase
            sbClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

            Alpine.data('kelvinApp', () => ({
                session: null, mode: 'login', activeTab: 'chats', loading: false,
                universitiesList: [], selectedUni: null, studentsOfUni: [],
                chatList: [], activeChat: null, messages: [], newMessage: '',
                form: { name: '', email: '', password: '', university: '' },

                async init() {
                    document.getElementById('loader').style.display = 'none';
                    const { data } = await sbClient.auth.getSession();
                    this.session = data.session;
                    this.fetchUniversities();
                    if (this.session) { this.fetchChats(); this.listen(); }
                },

                async fetchUniversities() {
                    const { data } = await sbClient.from('universities').select('*').order('name');
                    this.universitiesList = data || [];
                },

                async fetchStudents(uni) {
                    this.selectedUni = uni;
                    const { data } = await sbClient.from('profiles').select('*').eq('university', uni.name);
                    this.studentsOfUni = data || [];
                },

                async handleAuth() {
                    this.loading = true;
                    try {
                        if (this.mode === 'signup') {
                            const { data, error } = await sbClient.auth.signUp({ email: this.form.email, password: this.form.password });
                            if (error) throw error;
                            await sbClient.from('profiles').update({ full_name: this.form.name, university: this.form.university }).eq('id', data.user.id);
                            alert("Compte créé !"); this.mode = 'login';
                        } else {
                            const { error } = await sbClient.auth.signInWithPassword({ email: this.form.email, password: this.form.password });
                            if (error) throw error;
                            location.reload();
                        }
                    } catch (e) { alert(e.message); } finally { this.loading = false; }
                },

                async fetchChats() {
                    const { data } = await sbClient.from('profiles').select('*').limit(10);
                    this.chatList = data || [];
                },

                async openChat(stu) {
                    this.activeChat = stu;
                    this.fetchMessages();
                },

                async fetchMessages() {
                    const { data } = await sbClient.from('messages')
                        .select('*')
                        .or(`and(sender_id.eq.${this.session.user.id},receiver_id.eq.${this.activeChat.id}),and(sender_id.eq.${this.activeChat.id},receiver_id.eq.${this.session.user.id})`)
                        .order('created_at');
                    this.messages = data || [];
                },

                async sendMessage() {
                    if (!this.newMessage.trim()) return;
                    await sbClient.from('messages').insert({ sender_id: this.session.user.id, receiver_id: this.activeChat.id, content: this.newMessage });
                    this.newMessage = ''; this.fetchMessages();
                },

                listen() {
                    sbClient.channel('any').on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, () => {
                        if (this.activeChat) this.fetchMessages();
                    }).subscribe();
                },

                async signOut() { await sbClient.auth.signOut(); location.reload(); }
            }));
        });
    </script>
</body>
                                </html>
