<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kelvin Loving | WhatsApp Soft</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">

    <script>
        const S_URL = 'https://oemqhxmmoxykrqqhwnqq.supabase.co';
        const S_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9lbXFoeG1tb3h5a3JxcWh3bnFxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU3OTM3MzksImV4cCI6MjEwMTM2OTczOX0.F7lVdMft0gQEyGiQYrnE5BMaTcu3nxMQa8D1CX0icbQ';
        
        // On initialise Supabase immédiatement
        const sb = supabase.createClient(S_URL, S_KEY);

        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        love: { base: '#FFF9F9', soft: '#F8E7E7', accent: '#D988B9', wa: '#fedd02', text: '#4A3B3B' }
                    }
                }
            }
        }
    </script>

    <style>
        /* On enlève x-cloak pour forcer l'affichage quoi qu'il arrive */
        body { background-color: #FFF9F9; color: #4A3B3B; font-family: 'Outfit', sans-serif; margin: 0; }
        .tab-active { color: #D988B9; border-bottom: 3px solid #D988B9; }
        #loader { position: fixed; inset: 0; background: #FFF9F9; display: flex; align-items: center; justify-content: center; z-index: 9999; }
    </style>
</head>
<body x-data="whatsappSoft">

    <!-- CHARGEMENT (Disparaît très vite) -->
    <div id="loader" x-show="loadingScreen">
        <iconify-icon icon="line-md:loading-twotone-loop" style="font-size:50px; color:#D988B9;"></iconify-icon>
    </div>

    <div>
        <!-- 1. ÉCRAN AUTH -->
        <div x-show="!session" class="h-screen flex flex-col items-center justify-center p-8 text-center">
            <div class="w-20 h-20 bg-love-accent rounded-[2rem] mb-6 flex items-center justify-center shadow-lg">
                <iconify-icon icon="solar:heart-bold" class="text-white text-4xl"></iconify-icon>
            </div>
            <h1 class="text-3xl font-bold mb-8">Kelvin Loving</h1>
            <div class="w-full max-w-sm space-y-4">
                <template x-if="mode === 'signup'">
                    <div class="space-y-4">
                        <input type="text" x-model="form.name" placeholder="Nom Complet" class="w-full p-4 bg-white rounded-2xl shadow-sm border-none outline-none">
                        <select x-model="form.university" class="w-full p-4 bg-white rounded-2xl shadow-sm outline-none">
                            <option value="">Université...</option>
                            <template x-for="u in universities" :key="u.id"><option :value="u.name" x-text="u.name"></option></template>
                        </select>
                    </div>
                </template>
                <input type="email" x-model="form.email" placeholder="Email" class="w-full p-4 bg-white rounded-2xl shadow-sm border-none outline-none">
                <input type="password" x-model="form.password" placeholder="Mot de passe" class="w-full p-4 bg-white rounded-2xl shadow-sm border-none outline-none">
                <button @click="handleAuth" class="w-full bg-love-accent text-white font-bold py-4 rounded-2xl shadow-lg">Continuer</button>
                <p @click="mode = (mode === 'signup' ? 'login' : 'signup')" class="text-xs text-love-accent font-bold mt-4 cursor-pointer underline">Changer de mode</p>
            </div>
        </div>

        <!-- 2. APPLICATION -->
        <div x-show="session" class="h-screen flex flex-col">
            <header class="p-4 flex justify-between items-center bg-white shadow-sm">
                <h1 class="text-2xl font-bold text-love-text">WhatsApp</h1>
                <div class="flex gap-4 text-slate-400">
                    <iconify-icon icon="solar:magnifer-bold" width="24"></iconify-icon>
                    <iconify-icon icon="solar:menu-dots-vertical-bold" width="24" @click="signOut"></iconify-icon>
                </div>
            </header>

            <nav class="flex bg-white border-b border-love-soft sticky top-0 z-40">
                <button @click="activeTab = 'chats'" class="flex-1 py-4 text-[10px] font-bold uppercase" :class="activeTab === 'chats' ? 'tab-active' : 'text-slate-400'">Discussions</button>
                <button @click="activeTab = 'actus'" class="flex-1 py-4 text-[10px] font-bold uppercase" :class="activeTab === 'actus' ? 'tab-active' : 'text-slate-400'">Actus</button>
                <button @click="activeTab = 'campus'" class="flex-1 py-4 text-[10px] font-bold uppercase" :class="activeTab === 'campus' ? 'tab-active' : 'text-slate-400'">Campus</button>
                <button @click="activeTab = 'secrets'" class="flex-1 py-4 text-[10px] font-bold uppercase" :class="activeTab === 'secrets' ? 'tab-active' : 'text-slate-400'">Secrets</button>
            </nav>

            <main class="flex-1 overflow-y-auto pb-24">
                <!-- CHATS -->
                <div x-show="activeTab === 'chats'">
                    <template x-for="chat in chatList" :key="chat.id">
                        <div @click="openChat(chat)" class="flex items-center gap-4 p-4 hover:bg-love-soft/30 border-b border-love-soft/20 cursor-pointer">
                            <div class="w-14 h-14 rounded-full border-2 border-white shadow-sm overflow-hidden bg-love-soft">
                                <img :src="'https://api.dicebear.com/7.x/adventurer/svg?seed='+chat.full_name" class="w-full h-full">
                            </div>
                            <div class="flex-1">
                                <div class="flex justify-between items-center"><h3 class="font-bold text-sm" x-text="chat.full_name"></h3><span class="text-[9px] text-slate-400" x-text="chat.is_online ? 'En ligne' : 'Vu récemment'"></span></div>
                                <p class="text-[10px] text-love-accent font-bold" x-text="chat.distance + ' KM'"></p>
                            </div>
                        </div>
                    </template>
                </div>

                <!-- ACTUS -->
                <div x-show="activeTab === 'actus'" class="p-4">
                    <div class="flex items-center gap-4 mb-6">
                        <div class="relative w-14 h-14 bg-love-soft rounded-full flex items-center justify-center border-2 border-love-accent border-dashed">
                            <iconify-icon icon="solar:camera-bold" class="text-love-accent text-xl"></iconify-icon>
                            <div class="absolute bottom-0 right-0 bg-love-accent text-white rounded-full w-5 h-5 flex items-center justify-center font-bold">+</div>
                        </div>
                        <div><p class="font-bold text-sm">Mon statut</p><p class="text-xs text-slate-400">Ajouter une actu photo</p></div>
                    </div>
                </div>

                <!-- SECRETS -->
                <div x-show="activeTab === 'secrets'" class="p-6 space-y-4">
                    <template x-for="sec in secrets" :key="sec.id">
                        <div class="bg-white p-6 rounded-[2rem] shadow-sm border-b-4 border-love-soft">
                            <p class="text-sm italic" x-text="sec.content"></p>
                            <span class="text-[9px] opacity-20 mt-4 block uppercase font-bold">🤫 Confession anonyme</span>
                        </div>
                    </template>
                </div>

                <!-- CAMPUS -->
                <div x-show="activeTab === 'campus'">
                    <template x-for="uni in universities" :key="uni.id">
                        <div class="p-4 border-b border-love-soft/10 flex items-center gap-4">
                            <div class="w-10 h-10 bg-love-soft rounded-xl flex items-center justify-center text-love-accent font-black">L</div>
                            <span class="text-sm font-bold" x-text="uni.name"></span>
                        </div>
                    </template>
                </div>
            </main>

            <!-- BOUTONS FLOTTANTS WHATSAPP -->
            <div class="fixed bottom-24 right-6 flex flex-col gap-3">
                <template x-if="activeTab === 'actus'"><button class="w-14 h-14 bg-love-accent text-white rounded-2xl shadow-xl flex items-center justify-center"><iconify-icon icon="solar:camera-bold" width="28"></iconify-icon></button></template>
                <template x-if="activeTab === 'secrets'"><button class="w-14 h-14 bg-love-accent text-white rounded-2xl shadow-xl flex items-center justify-center"><iconify-icon icon="solar:pen-bold" width="28"></iconify-icon></button></template>
            </div>

            <!-- BARRE BAS -->
            <nav class="fixed bottom-0 w-full bg-white border-t border-love-soft grid grid-cols-4 pb-2">
                <button @click="activeTab = 'chats'" class="flex flex-col items-center py-3" :class="activeTab === 'chats' ? 'text-love-accent' : 'text-slate-400'"><iconify-icon icon="solar:chat-round-dots-bold" width="24"></iconify-icon><span class="text-[9px] font-bold">Discussions</span></button>
                <button @click="activeTab = 'actus'" class="flex flex-col items-center py-3" :class="activeTab === 'actus' ? 'text-love-accent' : 'text-slate-400'"><iconify-icon icon="solar:star-circle-bold" width="24"></iconify-icon><span class="text-[9px] font-bold">Actus</span></button>
                <button @click="activeTab = 'campus'" class="flex flex-col items-center py-3" :class="activeTab === 'campus' ? 'text-love-accent' : 'text-slate-400'"><iconify-icon icon="solar:users-group-rounded-bold" width="24"></iconify-icon><span class="text-[9px] font-bold">Campus</span></button>
                <button @click="activeTab = 'secrets'" class="flex-1 flex flex-col items-center py-3" :class="activeTab === 'secrets' ? 'text-love-accent' : 'text-slate-400'"><iconify-icon icon="solar:mask-happly-bold" width="24"></iconify-icon><span class="text-[9px] font-bold">Secrets</span></button>
            </nav>

            <!-- CHAT PRIVÉ -->
            <div x-show="activeChat" class="fixed inset-0 bg-love-base z-[100] flex flex-col">
                <header class="p-4 bg-white border-b border-love-soft flex items-center gap-4">
                    <button @click="activeChat = null"><iconify-icon icon="solar:arrow-left-bold" width="24" class="text-love-accent"></iconify-icon></button>
                    <p class="font-bold text-sm" x-text="activeChat?.full_name"></p>
                </header>
                <div class="flex-1 overflow-y-auto p-4 space-y-4">
                    <template x-for="m in messages" :key="m.id">
                        <div class="flex" :class="m.sender_id === session.user.id ? 'justify-end' : 'justify-start'">
                            <div class="p-4 rounded-[2rem] text-sm max-w-[85%] shadow-sm" :class="m.sender_id === session.user.id ? 'bg-love-accent text-white rounded-tr-none' : 'bg-white text-love-text border rounded-tl-none'">
                                <p x-text="m.content"></p>
                            </div>
                        </div>
                    </template>
                </div>
                <div class="p-4 bg-white flex gap-2">
                    <input type="text" x-model="newMessage" @keyup.enter="sendMessage" placeholder="Message..." class="flex-1 bg-love-soft p-4 rounded-full outline-none text-sm border-none shadow-inner">
                    <button @click="sendMessage" class="w-14 h-14 bg-love-accent text-white rounded-full flex items-center justify-center shadow-lg"><iconify-icon icon="solar:paper-plane-bold" width="22"></iconify-icon></button>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.data('whatsappSoft', () => ({
                session: null, activeTab: 'chats', activeChat: null, mode: 'login',
                profile: null, chatList: [], universities: [], secrets: [], messages: [], 
                loadingScreen: true, newMessage: '',
                form: { name: '', email: '', password: '', university: '' },

                async init() {
                    const { data } = await sb.auth.getSession();
                    this.session = data.session;
                    this.loadingScreen = false; // On cache le loader tout de suite

                    // On charge les données après l'affichage pour ne pas bloquer
                    this.loadData();
                    if (this.session) this.loadProfile();
                },

                async handleAuth() {
                    try {
                        if (this.mode === 'signup') {
                            const { data, error } = await sb.auth.signUp({ email: this.form.email, password: this.form.password });
                            if (error) throw error;
                            await sb.from('profiles').update({ full_name: this.form.name, university: this.form.university }).eq('id', data.user.id);
                            alert("Compte créé !");
                        } else {
                            await sb.auth.signInWithPassword({ email: this.form.email, password: this.form.password });
                            location.reload();
                        }
                    } catch (e) { alert(e.message); }
                },

                async loadData() {
                    // Chargement indépendant pour éviter les blocages
                    sb.from('universities').select('*').then(({data}) => this.universities = data || []);
                    sb.from('profiles').select('*').limit(20).then(({data}) => {
                        if(data) this.chatList = data.map(u => ({ ...u, distance: (Math.random()*5).toFixed(1) }));
                    });
                    sb.from('secrets').select('*').limit(10).then(({data}) => this.secrets = data || []);
                },

                async loadProfile() {
                    const { data } = await sb.from('profiles').select('*').eq('id', this.session.user.id).single();
                    this.profile = data;
                },

                async openChat(user) {
                    this.activeChat = user;
                    const { data } = await sb.from('messages')
                        .select('*')
                        .or(`and(sender_id.eq.${this.session.user.id},receiver_id.eq.${user.id}),and(sender_id.eq.${user.id},receiver_id.eq.${this.session.user.id})`)
                        .order('created_at');
                    this.messages = data || [];
                },

                async sendMessage() {
                    if (!this.newMessage.trim()) return;
                    await sb.from('messages').insert({ sender_id: this.session.user.id, receiver_id: this.activeChat.id, content: this.newMessage });
                    this.newMessage = '';
                    this.openChat(this.activeChat);
                },

                async signOut() { await sb.auth.signOut(); location.reload(); }
            }));
        });
    </script>
</body>
                                </html>
