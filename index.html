<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kelvin Loving | Soft Edition</title>
    
    <!-- Scripts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">

    <script>
        // CONFIG SUPABASE
        const SUPABASE_URL = 'https://oemqhxmmoxykrqqhwnqq.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9lbXFoeG1tb3h5a3JxcWh3bnFxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU3OTM3MzksImV4cCI6MjEwMTM2OTczOX0.F7lVdMft0gQEyGiQYrnE5BMaTcu3nxMQa8D1CX0icbQ';
        
        let sb;
        try {
            sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        } catch (e) { console.error("Erreur Supabase init"); }

        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        love: { light: '#FFF9F9', soft: '#F8E7E7', accent: '#D988B9', text: '#4A3B3B' }
                    }
                }
            }

    </script>

    <style>
        [x-cloak] { display: none !important; }
        body { background-color: #FFF9F9; color: #4A3B3B; font-family: 'Outfit', sans-serif; }
        .tab-active { color: #D988B9; border-bottom: 3px solid #D988B9; }
        .glass { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px); }
    </style>
</head>
<body x-data="kelvinSoft">

    <!-- CHARGEMENT DE SECOURS (Si écran blanc) -->
    <div id="loader" style="position:fixed; inset:0; background:#FFF9F9; display:flex; align-items:center; justify-content:center; z-index:9999;">
        <iconify-icon icon="line-md:loading-twotone-loop" style="font-size:50px; color:#D988B9;"></iconify-icon>
    </div>

    <div x-cloak x-show="true">
        <!-- 1. AUTHENTIFICATION -->
        <template x-if="!session">
            <div class="h-screen flex flex-col items-center justify-center p-8 text-center bg-[#FFF5F5]">
                <div class="w-20 h-20 bg-love-accent rounded-full mb-6 flex items-center justify-center shadow-lg">
                    <iconify-icon icon="solar:heart-bold" class="text-white text-4xl"></iconify-icon>
                </div>
                <h1 class="text-3xl font-bold text-love-text mb-8">Kelvin Loving</h1>
                <div class="w-full max-w-sm space-y-4">
                    <template x-if="mode === 'signup'">
                        <div class="space-y-4">
                            <input type="text" x-model="form.name" placeholder="Nom Complet" class="w-full p-4 bg-white rounded-2xl border-none shadow-sm">
                            <input type="tel" x-model="form.phone" placeholder="WhatsApp (ex: +243...)" class="w-full p-4 bg-white rounded-2xl border-none shadow-sm">
                        </div>
                    </template>
                    <input type="email" x-model="form.email" placeholder="Email" class="w-full p-4 bg-white rounded-2xl shadow-sm border-none">
                    <input type="password" x-model="form.password" placeholder="Mot de passe" class="w-full p-4 bg-white rounded-2xl shadow-sm border-none">
                    <button @click="handleAuth" class="w-full bg-love-accent text-white font-bold py-4 rounded-2xl" :disabled="loading">
                        <span x-text="mode === 'signup' ? 'Créer mon compte' : 'Se connecter'"></span>
                    </button>
                    <button @click="mode = (mode === 'signup' ? 'login' : 'signup')" class="text-xs text-love-accent font-bold mt-4 underline" x-text="mode === 'signup' ? 'Déjà inscrit ? Connecte-toi' : 'Pas de compte ? Inscris-toi'"></button>
                </div>
            </div>
        </template>

        <!-- 2. APPLICATION PRINCIPALE -->
        <template x-if="session">
            <div class="h-screen flex flex-col">
                <!-- HEADER -->
                <header class="p-4 flex justify-between items-center bg-white border-b border-love-soft sticky top-0 z-50">
                    <h1 class="text-2xl font-bold text-love-accent italic">Kelvin</h1>
                    <div class="flex gap-4">
                        <button @click="showProfile = true"><iconify-icon icon="solar:user-circle-bold" width="28" class="text-love-accent"></iconify-icon></button>
                    </div>
                </header>

                <!-- NAVIGATION -->
                <div class="flex bg-white border-b border-love-soft">
                    <button @click="activeTab = 'chats'" class="flex-1 py-4 text-xs font-bold" :class="activeTab === 'chats' ? 'tab-active' : 'text-slate-400'">Discussions</button>
                    <button @click="activeTab = 'actus'" class="flex-1 py-4 text-xs font-bold" :class="activeTab === 'actus' ? 'tab-active' : 'text-slate-400'">Actus</button>
                    <button @click="activeTab = 'campus'" class="flex-1 py-4 text-xs font-bold" :class="activeTab === 'campus' ? 'tab-active' : 'text-slate-400'">Campus</button>
                    <button @click="activeTab = 'secrets'" class="flex-1 py-4 text-xs font-bold" :class="activeTab === 'secrets' ? 'tab-active' : 'text-slate-400'">Secrets</button>
                </div>

                <main class="flex-1 overflow-y-auto pb-24">
                    <!-- CHATS LIST -->
                    <div x-show="activeTab === 'chats'">
                        <template x-for="chat in chatList" :key="chat.id">
                            <div @click="openChat(chat)" class="flex items-center gap-4 p-4 hover:bg-love-soft border-b border-love-soft/20">
                                <div class="w-12 h-12 bg-love-soft rounded-full flex items-center justify-center text-xl overflow-hidden border">
                                    <img :src="'https://api.dicebear.com/7.x/adventurer/svg?seed='+chat.full_name" class="w-full h-full">
                                </div>
                                <div class="flex-1 min-w-0">
                                    <div class="flex justify-between items-center">
                                        <p class="font-bold truncate" x-text="chat.full_name"></p>
                                        <span class="text-[9px] font-bold" :class="chat.is_online ? 'text-green-500' : 'text-slate-400'" x-text="chat.is_online ? 'En ligne' : chat.last_seen_formatted"></span>
                                    </div>
                                    <p class="text-[10px] text-love-accent font-bold" x-text="chat.distance + ' km'"></p>
                                </div>
                            </div>
                        </template>
                    </div>

                    <!-- SECRETS -->
                    <div x-show="activeTab === 'secrets'" class="p-6 space-y-4">
                        <template x-for="sec in secrets" :key="sec.id">
                            <div class="bg-white p-6 rounded-3xl shadow-sm border-b-4 border-love-accent/20">
                                <p class="text-sm italic" x-text="sec.content"></p>
                                <span class="text-[9px] opacity-40 mt-4 block">🤫 Confession anonyme</span>
                            </div>
                        </template>
                    </div>
                </main>

                <!-- BARRE DE CHAT PRIVÉE -->
                <div x-show="activeChat" class="fixed inset-0 bg-love-light z-[100] flex flex-col">
                    <header class="p-4 bg-white border-b border-love-soft flex items-center gap-4">
                        <button @click="activeChat = null"><iconify-icon icon="solar:arrow-left-bold" width="24" class="text-love-accent"></iconify-icon></button>
                        <p class="font-bold flex-1" x-text="activeChat?.full_name"></p>
                    </header>
                    <div class="flex-1 overflow-y-auto p-4 space-y-3" id="chat-scroller">
                        <template x-for="m in messages" :key="m.id">
                            <div class="flex" :class="m.sender_id === session.user.id ? 'justify-end' : 'justify-start'">
                                <div class="p-4 rounded-[2rem] text-sm max-w-[85%]" :class="m.sender_id === session.user.id ? 'bg-love-accent text-white rounded-tr-none' : 'bg-white text-love-text border rounded-tl-none'">
                                    <p x-text="m.content"></p>
                                </div>
                            </div>
                        </template>
                    </div>
                    <div class="p-4 bg-white flex gap-2">
                        <input type="text" x-model="newMessage" placeholder="Message..." class="flex-1 bg-love-light p-4 rounded-full border-none outline-none text-sm">
                        <button @click="sendMessage" class="w-14 h-14 bg-love-accent text-white rounded-full flex items-center justify-center">
                            <iconify-icon icon="solar:paper-plane-bold" width="24"></iconify-icon>
                        </button>
                    </div>
                </div>
                
                <!-- PROFIL MODAL -->
                <div x-show="showProfile" class="fixed inset-0 z-[200] flex items-end">
                    <div class="absolute inset-0 bg-black/20" @click="showProfile = false"></div>
                    <div class="relative w-full bg-white rounded-t-[3rem] p-8 space-y-6 shadow-2xl">
                        <div class="flex flex-col items-center">
                            <div class="w-24 h-24 rounded-3xl border-4 border-love-accent overflow-hidden mb-2">
                                <img :src="'https://api.dicebear.com/7.x/adventurer/svg?seed='+profile?.full_name" class="w-full h-full">
                            </div>
                            <h2 class="text-2xl font-bold" x-text="profile?.full_name"></h2>
                        </div>
                        <div class="bg-love-light p-4 rounded-2xl">
                            <p class="text-[10px] text-slate-400 font-bold">WHATSAPP</p>
                            <p class="font-bold" x-text="profile?.phone || 'Non renseigné'"></p>
                        </div>
                        <button @click="signOut" class="w-full py-4 text-red-500 font-bold border rounded-2xl">Se déconnecter</button>
                    </div>
                </div>

            </div>
        </template>
    </div>

    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.data('kelvinSoft', () => ({
                session: null, activeTab: 'chats', activeChat: null, showProfile: false,
                mode: 'login', profile: null, chatList: [], universities: [],
                secrets: [], messages: [], newMessage: '', loading: false,
                form: { name: '', email: '', password: '', phone: '' },

                async init() {
                    try {
                        const { data } = await sb.auth.getSession();
                        this.session = data.session;
                        document.getElementById('loader').style.display = 'none';

                        if (this.session) {
                            await this.loadProfile();
                            this.updateOnlineStatus();
                            this.fetchChats();
                            this.fetchSecrets();
                            this.listen();
                        }
                    } catch (e) {
                        console.error("Init Error", e);
                        document.getElementById('loader').style.display = 'none';
                    }
                },

                async handleAuth() {
                    this.loading = true;
                    try {
                        if (this.mode === 'signup') {
                            const { data, error } = await sb.auth.signUp({ email: this.form.email, password: this.form.password });
                            if (error) throw error;
                            await sb.from('profiles').update({ full_name: this.form.name, phone: this.form.phone }).eq('id', data.user.id);
                            alert("Compte créé !");
                        } else {
                            const { error } = await sb.auth.signInWithPassword({ email: this.form.email, password: this.form.password });
                            if (error) throw error;
                            location.reload();
                        }
                    } catch (e) { alert(e.message); }
                    this.loading = false;
                },

                async loadProfile() {
                    const { data } = await sb.from('profiles').select('*').eq('id', this.session.user.id).single();
                    this.profile = data;
                },

                async fetchChats() {
                    const { data } = await sb.from('profiles').select('*').neq('id', this.session.user.id);
                    if (data) {
                        this.chatList = data.map(u => ({
                            ...u,
                            distance: this.calcDist(this.profile?.latitude, this.profile?.longitude, u.latitude, u.longitude).toFixed(1),
                            is_online: (new Date() - new Date(u.last_seen)) < 300000,
                            last_seen_formatted: 'Vu à ' + new Date(u.last_seen).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})
                        }));
                    }
                },

                async fetchSecrets() {
                    const { data } = await sb.from('secrets').select('*').order('created_at', { ascending: false });
                    this.secrets = data || [];
                },

                calcDist(lat1, lon1, lat2, lon2) {
                    if (!lat1 || !lat2) return 0;
                    const R = 6371;
                    const dLat = (lat2-lat1) * Math.PI/180;
                    const dLon = (lon2-lon1) * Math.PI/180;
                    const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLon/2)*Math.sin(dLon/2);
                    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
                },

                async updateOnlineStatus() {
                    await sb.from('profiles').update({ last_seen: new Date() }).eq('id', this.session.user.id);
                    // Update GPS
                    navigator.geolocation.getCurrentPosition(async (p) => {
                        await sb.from('profiles').update({ latitude: p.coords.latitude, longitude: p.coords.longitude }).eq('id', this.session.user.id);
                    });
                },

                async openChat(user) {
                    this.activeChat = user;
                    const { data } = await sb.from('messages')
                        .select('*')
                        .or(`and(sender_id.eq.${this.session.user.id},receiver_id.eq.${user.id}),and(sender_id.eq.${user.id},receiver_id.eq.${this.session.user.id})`)
                        .order('created_at');
                    this.messages = data || [];
                    setTimeout(() => { const s = document.getElementById('chat-scroller'); if(s) s.scrollTop = s.scrollHeight; }, 100);
                },

                async sendMessage() {
                    if (!this.newMessage.trim()) return;
                    await sb.from('messages').insert({ sender_id: this.session.user.id, receiver_id: this.activeChat.id, content: this.newMessage });
                    this.newMessage = '';
                    this.openChat(this.activeChat);
                },

                listen() {
                    sb.channel('updates').on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, () => {
                        if(this.activeChat) this.openChat(this.activeChat);
                    }).subscribe();
                },

                async signOut() { await sb.auth.signOut(); location.reload(); }
            }));
        });
    </script>
</body>
</html>
