<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Campus Lushi | Soft Edition</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">

    <script>
        const S_URL = 'https://oemqhxmmoxykrqqhwnqq.supabase.co';
        const S_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9lbXFoeG1tb3h5a3JxcWh3bnFxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU3OTM3MzksImV4cCI6MjEwMTM2OTczOX0.F7lVdMft0gQEyGiQYrnE5BMaTcu3nxMQa8D1CX0icbQ';
        const sb = supabase.createClient(S_URL, S_KEY);

        tailwind.config = {
            theme: {
                extend: {
                    colors: { love: { base: '#FFF9F9', soft: '#F8E7E7', accent: '#D988B9', text: '#4A3B3B' } }
                }
            }
        }
    </script>

    <style>
        body { background-color: #FFF9F9; color: #4A3B3B; font-family: 'Outfit', sans-serif; margin: 0; -webkit-tap-highlight-color: transparent; }
        .tab-active { color: #D988B9; border-bottom: 3px solid #D988B9; }
        #loader { position: fixed; inset: 0; background: #FFF9F9; display: flex; align-items: center; justify-content: center; z-index: 9999; }
        .unread-badge { background-color: #D988B9; color: white; min-width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 800; }
        [x-cloak] { display: none !important; }
    </style>
</head>
<body x-data="kelvinApp">

    <div id="loader" x-show="loadingScreen">
        <iconify-icon icon="line-md:loading-twotone-loop" style="font-size:50px; color:#D988B9;"></iconify-icon>
    </div>

    <div x-cloak x-show="!loadingScreen">
        <!-- 1. AUTH (Formulaire complet) -->
        <div x-show="!session" class="h-screen flex flex-col items-center justify-center p-8 text-center bg-[#FFF5F5] overflow-y-auto">
            <div class="w-16 h-16 bg-love-accent rounded-2xl mb-4 flex items-center justify-center shadow-lg">
                <iconify-icon icon="solar:heart-bold" class="text-white text-3xl"></iconify-icon>
            </div>
            <h1 class="text-2xl font-bold mb-6 italic">Campus Lushi</h1>
            
            <div class="w-full max-w-sm space-y-3">
                <template x-if="mode === 'signup'">
                    <div class="space-y-3 animate-in fade-in">
                        <input type="text" x-model="form.name" placeholder="Prénom & Nom" class="w-full p-3.5 bg-white rounded-xl shadow-sm outline-none border-none">
                        
                        <div class="flex gap-2">
                            <select x-model="form.gender" class="flex-1 p-3.5 bg-white rounded-xl shadow-sm outline-none text-sm">
                                <option value="">Sexe...</option>
                                <option value="Femme">Femme 🚺</option>
                                <option value="Homme">Homme 🚹</option>
                            </select>
                            <input type="number" x-model="form.age" placeholder="Âge" class="w-20 p-3.5 bg-white rounded-xl shadow-sm outline-none border-none">
                        </div>

                        <select x-model="form.university" class="w-full p-3.5 bg-white rounded-xl shadow-sm outline-none text-sm">
                            <option value="">Ton établissement...</option>
                            <template x-for="u in universities" :key="u.id"><option :value="u.name" x-text="u.name"></option></template>
                        </select>
                    </div>
                </template>

                <input type="email" x-model="form.email" placeholder="Email" class="w-full p-3.5 bg-white rounded-xl shadow-sm outline-none border-none">
                <input type="password" x-model="form.password" placeholder="Mot de passe" class="w-full p-3.5 bg-white rounded-xl shadow-sm border-none outline-none">
                
                <button @click="handleAuth" class="w-full bg-love-accent text-white font-bold py-4 rounded-xl shadow-lg active:scale-95 transition-all flex items-center justify-center gap-2">
                    <span x-text="mode === 'signup' ? 'CRÉER MON COMPTE' : 'SE CONNECTER'"></span>
                    <iconify-icon icon="solar:round-alt-arrow-right-bold" width="20"></iconify-icon>
                </button>
                
                <p @click="mode = (mode === 'signup' ? 'login' : 'signup')" class="text-xs text-love-accent font-bold mt-4 underline cursor-pointer">
                    <span x-text="mode === 'signup' ? 'Déjà inscrit ? Connecte-toi' : 'Nouveau ? Inscris-toi ici'"></span>
                </p>
            </div>
        </div>

        <!-- 2. APPLICATION (Interface) -->
        <div x-show="session" class="h-screen flex flex-col overflow-hidden">
            <header class="p-4 flex justify-between items-center bg-white border-b border-love-soft sticky top-0 z-50">
                <h1 class="text-2xl font-black text-love-accent italic">WhatsApp</h1>
                <div class="flex gap-4 items-center">
                    <iconify-icon icon="solar:magnifer-bold" width="24" class="text-slate-400"></iconify-icon>
                    <button @click="activeTab = 'settings'" class="w-10 h-10 rounded-full border-2 border-love-accent overflow-hidden">
                        <img :src="profile?.avatar_url || 'https://api.dicebear.com/7.x/adventurer/svg?seed='+profile?.full_name" class="w-full h-full object-cover">
                    </button>
                </div>
            </header>

            <nav class="flex bg-white border-b border-love-soft z-40" x-show="activeTab !== 'settings'">
                <button @click="activeTab = 'chats'" class="flex-1 py-4 text-[10px] font-bold uppercase text-center" :class="activeTab === 'chats' ? 'tab-active' : 'text-slate-400'">Discussions</button>
                <button @click="activeTab = 'actus'" class="flex-1 py-4 text-[10px] font-bold uppercase text-center" :class="activeTab === 'actus' ? 'tab-active' : 'text-slate-400'">Actus</button>
                <button @click="activeTab = 'campus'" class="flex-1 py-4 text-[10px] font-bold uppercase text-center" :class="activeTab === 'campus' ? 'tab-active' : 'text-slate-400'">Campus</button>
                <button @click="activeTab = 'secrets'" class="flex-1 py-4 text-[10px] font-bold uppercase text-center" :class="activeTab === 'secrets' ? 'tab-active' : 'text-slate-400'">Secrets</button>
            </nav>

            <main class="flex-1 overflow-y-auto pb-24">
                <!-- LE CONTENU RESTE IDENTIQUE (DISCUSSIONS, ACTUS, CAMPUS, SECRETS, SETTINGS) -->
                <!-- Note: Dans Settings, on affiche maintenant Age et Genre -->
                <div x-show="activeTab === 'settings'" class="p-6 space-y-6 animate-in fade-in">
                    <div class="flex flex-col items-center">
                        <div class="w-28 h-28 rounded-3xl border-4 border-love-accent overflow-hidden shadow-xl mb-4">
                            <img :src="profile?.avatar_url || 'https://api.dicebear.com/7.x/adventurer/svg?seed='+profile?.full_name" class="w-full h-full object-cover">
                        </div>
                        <h2 class="text-xl font-bold" x-text="profile?.full_name"></h2>
                        <div class="flex gap-2 mt-1">
                            <span class="text-[9px] font-black text-white bg-love-accent px-2 py-0.5 rounded-full uppercase" x-text="profile?.gender"></span>
                            <span class="text-[9px] font-black text-love-accent bg-love-soft px-2 py-0.5 rounded-full uppercase" x-text="profile?.age + ' ANS'"></span>
                        </div>
                    </div>
                    
                    <div class="space-y-3">
                        <div class="bg-white p-4 rounded-2xl border border-love-soft">
                             <p class="text-[9px] font-bold text-slate-400 uppercase">Mon Université</p>
                             <p class="font-bold text-sm" x-text="profile?.university"></p>
                        </div>
                        <button @click="signOut" class="w-full p-4 bg-white text-red-500 font-bold rounded-2xl border border-red-50 flex items-center justify-between shadow-sm">
                            Déconnexion <iconify-icon icon="solar:logout-bold"></iconify-icon>
                        </button>
                    </div>
                </div>

                <!-- (LISTE CHATS, CAMPUS, SECRETS... GARDER TON CODE PRÉCÉDENT ICI) -->
            </main>

            <!-- CHAT PRIVÉ (Bulles + Coches) -->
            <div x-show="activeChat" class="fixed inset-0 bg-white z-[1000] flex flex-col animate-in slide-in-from-right">
                <header class="p-4 bg-white border-b border-love-soft flex items-center gap-4 shadow-sm">
                    <button @click="activeChat = null"><iconify-icon icon="solar:arrow-left-bold" width="24" class="text-love-accent"></iconify-icon></button>
                    <div class="flex-1">
                        <p class="font-bold text-sm" x-text="activeChat?.full_name"></p>
                        <p class="text-[9px] text-green-500 font-bold">EN LIGNE</p>
                    </div>
                </header>
                <div class="flex-1 overflow-y-auto p-4 space-y-4" id="cbox">
                    <template x-for="m in messages" :key="m.id">
                        <div class="flex" :class="m.sender_id === session.user.id ? 'justify-end' : 'justify-start'">
                            <div class="p-4 rounded-[2rem] text-sm max-w-[85%] shadow-sm relative" :class="m.sender_id === session.user.id ? 'bg-love-accent text-white rounded-tr-none' : 'bg-love-soft/30 text-love-text border rounded-tl-none border-love-soft'">
                                <p x-text="m.content"></p>
                                <template x-if="m.sender_id === session.user.id">
                                    <div class="flex justify-end mt-1">
                                        <iconify-icon :icon="m.is_read ? 'mingcute:check-2-fill' : 'mingcute:check-fill'" :class="m.is_read ? 'text-blue-400' : 'text-white/40'" width="14"></iconify-icon>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </template>
                </div>
                <div class="p-4 bg-white flex gap-2">
                    <input type="text" x-model="newMessage" @keyup.enter="sendMessage" placeholder="Message..." class="flex-1 bg-love-soft/30 p-4 rounded-full outline-none text-sm border-none shadow-inner">
                    <button @click="sendMessage" class="w-14 h-14 bg-love-accent text-white rounded-full flex items-center justify-center active:scale-90 transition-all"><iconify-icon icon="solar:paper-plane-bold" width="22"></iconify-icon></button>
                </div>
            </div>
        </div>
    </div>
    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.data('kelvinApp', () => ({
                session: null, activeTab: 'chats', activeChat: null, mode: 'login',
                universities: [], chatList: [], stories: [], secrets: [], messages: [],
                selectedUni: null, studentsOfUni: [], newMessage: '', loadingScreen: true,
                form: { name: '', email: '', password: '', university: '', gender: '', age: '', lat: null, lng: null },
                profile: { full_name: '', avatar_url: '', gender: '', age: '' },

                async init() {
                    const { data } = await sb.auth.getSession();
                    this.session = data.session;
                    this.loadingScreen = false;
                    this.loadData();
                    if (this.session) {
                        await this.loadProfile();
                        this.updateLocation(); // Lance le GPS
                    }
                },

                // INSCRIPTION AVEC GPS, GENRE ET AGE
                async handleAuth() {
                    try {
                        if (this.mode === 'signup') {
                            // Demander le GPS avant de finaliser
                            await this.getGPS();

                            const { data, error } = await sb.auth.signUp({ 
                                email: this.form.email, 
                                password: this.form.password 
                            });
                            if (error) throw error;

                            // SAUVEGARDE COMPLÈTE DANS LA TABLE PROFILES
                            await sb.from('profiles').update({ 
                                full_name: this.form.name, 
                                university: this.form.university,
                                gender: this.form.gender,
                                age: parseInt(this.form.age),
                                latitude: this.form.lat,
                                longitude: this.form.lng
                            }).eq('id', data.user.id);

                            alert("Inscription réussie !");
                        } else {
                            const { error } = await sb.auth.signInWithPassword({ email: this.form.email, password: this.form.password });
                            if (error) throw error;
                            location.reload();
                        }
                    } catch (e) { alert(e.message) }
                },

                async getGPS() {
                    return new Promise((resolve) => {
                        if (!navigator.geolocation) return resolve();
                        navigator.geolocation.getCurrentPosition((p) => {
                            this.form.lat = p.coords.latitude;
                            this.form.lng = p.coords.longitude;
                            resolve();
                        }, () => resolve());
                    });
                },

                loadData() {
                    sb.from('universities').select('*').order('name').then(({data}) => this.universities = data || []);
                    sb.from('profiles').select('*').limit(50).then(({data}) => {
                        if(data) this.chatList = data.filter(u => u.id !== this.session?.user?.id).map(u => ({
                            ...u,
                            distance: this.calcDist(this.profile?.latitude, this.profile?.longitude, u.latitude, u.longitude).toFixed(1)
                        }));
                    });
                    this.loadStories();
                    sb.from('secrets').select('*').order('created_at', {ascending: false}).then(({data}) => this.secrets = data || []);
                },

                async loadStories() {
                    const { data } = await sb.from('stories').select('*, profiles(full_name)').order('created_at', {ascending: false});
                    this.stories = data || [];
                },

                async loadProfile() {
                    const { data } = await sb.from('profiles').select('*').eq('id', this.session.user.id).single();
                    if(data) this.profile = data;
                },

                async updateLocation() {
                    navigator.geolocation.getCurrentPosition(async (p) => {
                        await sb.from('profiles').update({ 
                            latitude: p.coords.latitude, 
                            longitude: p.coords.longitude,
                            last_seen: new Date()
                        }).eq('id', this.session.user.id);
                    });
                },

                calcDist(lat1, lon1, lat2, lon2) {
                    if (!lat1 || !lat2) return 0;
                    const R = 6371;
                    const dLat = (lat2-lat1) * Math.PI/180;
                    const dLon = (lon2-lon1) * Math.PI/180;
                    const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLon/2)*Math.sin(dLon/2);
                    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
                },

                async signOut() { await sb.auth.signOut(); location.reload(); }
            }));
        });
    </script>
</body>
</html>
