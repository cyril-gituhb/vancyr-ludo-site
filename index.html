<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KELVIN LOVING 🏖️</title>
    
    <!-- Scripts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <script>
        // CONFIGURATION SUPABASE
        const SUPABASE_URL = 'https://oemqhxmmoxykrqqhwnqq.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9lbXFoeG1tb3h5a3JxcWh3bnFxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU3OTM3MzksImV4cCI6MjEwMTM2OTczOX0.F7lVdMft0gQEyGiQYrnE5BMaTcu3nxMQa8D1CX0icbQ';
        
        // On utilise un nom différent pour la variable de client
        let sbClient;
        try {
            sbClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        } catch(e) {
            console.error("Erreur d'initialisation Supabase");
        }

        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { brand: { 600: '#3366ff', 500: '#254eda' } } } }
        }
    </script>

    <style>
        /* x-cloak masque les éléments tant que AlpineJS n'est pas chargé */
        [x-cloak] { display: none !important; }
        .heart-shape {
            clip-path: path("M225,400 C225,400 0,280 0,140 A100,100 0 0,1 225,140 A100,100 0 0,1 450,140 C450,280 225,400 225,400 Z");
            background: white;
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 min-h-screen font-sans">

    <div x-data="kelvinApp" x-cloak>
        <!-- ÉCRAN D'ACCUEIL / INSCRIPTION -->
        <template x-if="!session">
            <div class="flex flex-col items-center pt-10 px-4">
                <h1 class="text-4xl font-black text-brand-600 mb-6 tracking-tighter">KELVIN LOVING</h1>
                
                <div class="relative w-full max-w-[450px] aspect-[450/550] flex items-center justify-center">
                    <!-- Forme de coeur -->
                    <div class="heart-shape absolute inset-0 shadow-2xl border border-slate-100"></div>
                    
                    <form @submit.prevent="handleAuth" class="relative z-10 w-full px-10 pt-10 flex flex-col gap-2">
                        <h2 class="text-center font-bold text-slate-700 text-lg mb-2" x-text="mode === 'signup' ? 'REJOINDRE LE CAMPUS' : 'CONNEXION'"></h2>
                        
                        <template x-if="mode === 'signup'">
                            <div class="space-y-2">
                                <input type="text" x-model="form.name" placeholder="Nom Complet" class="w-full p-2 text-sm border-b outline-none focus:border-brand-600" required>
                                <div class="flex gap-2">
                                    <select x-model="form.gender" class="flex-1 p-2 text-sm border-b outline-none">
                                        <option value="Fille">Fille 🚺</option>
                                        <option value="Garçon">Garçon 🚹</option>
                                    </select>
                                    <input type="number" x-model="form.age" placeholder="Âge" class="w-16 p-2 text-sm border-b outline-none" required>
                                </div>
                                <input type="text" x-model="form.university" placeholder="Université" class="w-full p-2 text-sm border-b outline-none">
                                <input type="file" @change="uploadFile = $event.target.files[0]" class="text-[10px] mt-2">
                            </div>
                        </template>

                        <input type="email" x-model="form.email" placeholder="Email" class="w-full p-2 text-sm border-b outline-none focus:border-brand-600" required>
                        <input type="password" x-model="form.password" placeholder="Mot de passe" class="w-full p-2 text-sm border-b outline-none focus:border-brand-600" required>

                        <button type="submit" class="bg-brand-600 text-white font-black py-4 rounded-full mt-4 shadow-xl flex items-center justify-center gap-2 active:scale-95 transition-all" :disabled="loading">
                            <span x-show="!loading" x-text="mode === 'signup' ? 'REJOINDRE' : 'SE CONNECTER'"></span>
                            <iconify-icon x-show="loading" icon="line-md:loading-twotone-loop" width="20"></iconify-icon>
                        </button>

                        <button type="button" @click="mode = (mode === 'signup' ? 'login' : 'signup')" class="text-[11px] text-slate-400 mt-4 text-center">
                            <span x-text="mode === 'signup' ? 'Déjà un compte ?' : 'Pas inscrit ?'"></span> 
                            <span class="text-brand-600 font-bold underline">Clique ici</span>
                        </button>
                    </form>
                </div>
            </div>
        </template>

        <!-- SI CONNECTÉ -->
        <template x-if="session">
            <div class="p-10 text-center">
                <h1 class="text-2xl font-bold dark:text-white">Bienvenue, <span x-text="profile?.full_name || 'étudiant'"></span> !</h1>
                <button @click="signOut" class="mt-4 text-red-500 font-bold">Se déconnecter</button>
            </div>
        </template>
    </div>

    <!-- Message de secours si rien ne charge -->
    <div id="fallback" class="fixed inset-0 flex items-center justify-center bg-slate-900 text-white z-[-1]">
        Chargement de KELVIN LOVING...
    </div>

    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.data('kelvinApp', () => ({
                mode: 'signup',
                loading: false,
                session: null,
                profile: null,
                uploadFile: null,
                form: { name: '', email: '', password: '', gender: 'Fille', age: '', university: '', lat: null, lng: null },

                async init() {
                    // Masquer le message de secours une fois Alpine chargé
                    document.getElementById('fallback').style.display = 'none';

                    const { data } = await sbClient.auth.getSession();
                    this.session = data.session;
                    if (this.session) {
                        await this.loadProfile();
                    }
                },

                async handleAuth() {
                    this.loading = true;
                    try {
                        if (this.mode === 'signup') {
                            const { data, error } = await sbClient.auth.signUp({ 
                                email: this.form.email, 
                                password: this.form.password 
                            });
                            if (error) throw error;
                            
                            // Inscription réussie, mise à jour du profil
                            const { error: updError } = await sbClient.from('profiles').update({
                                full_name: this.form.name,
                                gender: this.form.gender,
                                age: this.form.age,
                                university: this.form.university
                            }).eq('id', data.user.id);
                            
                            alert("Vérifie tes emails pour confirmer l'inscription !");
                        } else {
                            const { error } = await sbClient.auth.signInWithPassword({ 
                                email: this.form.email, 
                                password: this.form.password 
                            });
                            if (error) throw error;
                            window.location.reload();
                        }
                    } catch (e) {
                        alert(e.message);
                    } finally {
                        this.loading = false;
                    }
                },

                async loadProfile() {
                    const { data } = await sbClient.from('profiles').select('*').eq('id', this.session.user.id).single();
                    this.profile = data;
                },

                async signOut() {
                    await sbClient.auth.signOut();
                    window.location.reload();
                }
            }));
        });
    </script>
</body>
                            </html>
