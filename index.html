<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kelvin Loving | Soft Campus</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">

    <script>
        const S_URL = 'https://oemqhxmmoxykrqqhwnqq.supabase.co';
        const S_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9lbXFoeG1tb3h5a3JxcWh3bnFxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU3OTM3MzksImV4cCI6MjEwMTM2OTczOX0.F7lVdMft0gQEyGiQYrnE5BMaTcu3nxMQa8D1CX0icbQ';
        const sb = supabase.createClient(S_URL, S_KEY);

        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        love: { base: '#FFF9F9', soft: '#F8E7E7', accent: '#D988B9', text: '#4A3B3B' }
                    }
                }
            }
        }
    </script>

    <style>
        body { background-color: #FFF9F9; color: #4A3B3B; font-family: 'Outfit', sans-serif; margin: 0; -webkit-tap-highlight-color: transparent; }
        .tab-active { color: #D988B9; border-bottom: 3px solid #D988B9; }
        #loader { position: fixed; inset: 0; background: #FFF9F9; display: flex; align-items: center; justify-content: center; z-index: 9999; }
        [x-cloak] { display: none !important; }
    </style>
</head>
<body x-data="kelvinApp">

    <div id="loader" x-show="loadingScreen">
        <iconify-icon icon="line-md:loading-twotone-loop" style="font-size:50px; color:#D988B9;"></iconify-icon>
    </div>

    <div x-cloak x-show="!loadingScreen">
        
        <!-- 1. AUTHENTIFICATION -->
        <div x-show="!session" class="h-screen flex flex-col items-center justify-center p-8 text-center bg-[#FFF5F5]">
            <div class="w-20 h-20 bg-love-accent rounded-[2rem] mb-6 flex items-center justify-center shadow-lg">
                <iconify-icon icon="solar:heart-bold" class="text-white text-4xl"></iconify-icon>
            </div>
            <h1 class="text-3xl font-bold mb-8 italic">Kelvin Loving</h1>
            <div class="w-full max-w-sm space-y-4">
                <template x-if="mode === 'signup'">
                    <div class="space-y-4">
                        <input type="text" x-model="form.name" placeholder="Prénom & Nom" class="w-full p-4 bg-white rounded-2xl shadow-sm outline-none border-none">
                        <select x-model="form.university" class="w-full p-4 bg-white rounded-2xl shadow-sm outline-none text-sm">
                            <option value="">Ton établissement...</option>
                            <template x-for="u in universities" :key="u.id"><option :value="u.name" x-text="u.name"></option></template>
                        </select>
                    </div>
                </template>
                <input type="email" x-model="form.email" placeholder="Email" class="w-full p-4 bg-white rounded-2xl shadow-sm outline-none">
                <input type="password" x-model="form.password" placeholder="Mot de passe" class="w-full p-4 bg-white rounded-2xl shadow-sm outline-none">
                <button @click="handleAuth" class="w-full bg-love-accent text-white font-bold py-4 rounded-2xl shadow-lg active:scale-95 transition-all">Continuer</button>
                <button @click="mode = (mode === 'signup' ? 'login' : 'signup')" class="text-xs text-love-accent font-bold mt-4" x-text="mode === 'signup' ? 'Déjà un compte ? Connexion' : 'Pas de compte ? Créer'"></button>
            </div>
        </div>

        <!-- 2. APPLICATION -->
        <div x-show="session" class="h-screen flex flex-col overflow-hidden">
            
            <header class="p-4 flex justify-between items-center bg-white sticky top-0 z-50">
                <h1 class="text-2xl font-black text-love-accent italic">WhatsApp</h1>
                <div class="flex gap-4 items-center">
                    <iconify-icon icon="solar:magnifer-bold" width="24" class="text-slate-400"></iconify-icon>
                    <button @click="activeTab = 'settings'" class="w-10 h-10 rounded-full border-2 border-love-accent overflow-hidden">
                        <img :src="profile?.avatar_url || 'https://api.dicebear.com/7.x/adventurer/svg?seed='+profile?.full_name" class="w-full h-full object-cover">
                    </button>
                </div>
            </header>

            <nav class="flex bg-white border-b border-love-soft z-40" x-show="activeTab !== 'settings'">
                <button @click="activeTab = 'chats'" class="flex-1 py-4 text-[10px] font-bold uppercase text-center" :class="activeTab === 'chats' ? 'tab-active' : 'text-slate-400'">Discussions</button>
                <button @click="activeTab = 'actus'" class="flex-1 py-4 text-[10px] font-bold uppercase text-center" :class="activeTab === 'actus' ? 'tab-active' : 'text-slate-400'">Actus</button>
                <button @click="activeTab = 'campus'" class="flex-1 py-4 text-[10px] font-bold uppercase text-center" :class="activeTab === 'campus' ? 'tab-active' : 'text-slate-400'">Campus</button>
                <button @click="activeTab = 'secrets'" class="flex-1 py-4 text-[10px] font-bold uppercase text-center" :class="activeTab === 'secrets' ? 'tab-active' : 'text-slate-400'">Secrets</button>
            </nav>

            <main class="flex-1 overflow-y-auto pb-24">
                
                <!-- DISCUSSIONS -->
                <div x-show="activeTab === 'chats'">
                    <template x-for="chat in chatList" :key="chat.id">
                        <div @click="openChat(chat)" class="flex items-center gap-4 p-4 border-b border-love-soft/20 cursor-pointer">
                            <div class="w-14 h-14 rounded-full border-2 border-white bg-love-soft overflow-hidden">
                                <img :src="chat.avatar_url || 'https://api.dicebear.com/7.x/adventurer/svg?seed='+chat.full_name" class="w-full h-full object-cover">
                            </div>
                            <div class="flex-1 min-w-0">
                                <div class="flex justify-between items-center"><h3 class="font-bold text-sm" x-text="chat.full_name"></h3><span class="text-[9px] text-love-accent font-bold" x-text="chat.distance + ' km'"></span></div>
                                <p class="text-[10px] text-slate-400 truncate" x-text="chat.university"></p>
                            </div>
                        </div>
                    </template>
                </div>

                <!-- ACTUS (Style Facebook) -->
                <div x-show="activeTab === 'actus'" class="p-2 space-y-4 bg-[#F0F2F5]/30 min-h-full">
                    <div class="bg-white p-4 rounded-2xl shadow-sm border border-love-soft flex items-center gap-4">
                        <label class="w-10 h-10 bg-love-soft rounded-full flex items-center justify-center border-2 border-love-accent border-dashed cursor-pointer">
                            <input type="file" @change="uploadStatus" class="hidden" accept="image/*">
                            <iconify-icon icon="solar:camera-bold" class="text-love-accent"></iconify-icon>
                        </label>
                        <p class="text-sm opacity-50 font-bold">Publier quelque chose...</p>
                    </div>

                    <template x-for="s in stories" :key="s.id">
                        <div class="bg-white rounded-2xl shadow-sm border border-love-soft overflow-hidden">
                            <div class="p-3 flex items-center justify-between">
                                <div class="flex items-center gap-2">
                                    <div class="w-8 h-8 rounded-full bg-love-soft border border-love-accent flex items-center justify-center text-[10px] font-bold text-love-accent">🎓</div>
                                    <span class="font-bold text-sm" x-text="s.author_name || 'Étudiant'"></span>
                                </div>
                                <button x-show="s.user_id === session?.user?.id" @click="deleteStory(s.id)" class="text-red-300 p-2"><iconify-icon icon="solar:trash-bin-trash-bold"></iconify-icon></button>
                            </div>
                            <img :src="s.photo_url" class="w-full max-h-[500px] object-cover bg-love-soft">
                            <div class="p-3"><p class="text-sm leading-relaxed" x-text="s.caption"></p></div>
                        </div>
                    </template>
                </div>

                <!-- CAMPUS -->
                <div x-show="activeTab === 'campus'">
                    <template x-if="!selectedUni">
                        <div class="p-4 space-y-2">
                            <template x-for="uni in universities" :key="uni.id">
                                <div @click="viewUni(uni)" class="p-4 bg-white rounded-2xl shadow-sm border border-love-soft flex items-center gap-4 cursor-pointer hover:bg-love-soft/20">
                                    <div class="w-10 h-10 bg-love-soft rounded-xl flex items-center justify-center text-love-accent font-black">L</div>
                                    <span class="text-sm font-bold" x-text="uni.name"></span>
                                </div>
                            </template>
                        </div>
                    </template>
                    <template x-if="selectedUni">
                        <div>
                            <header class="p-4 bg-love-soft/30 flex items-center gap-4 sticky top-0">
                                <button @click="selectedUni = null"><iconify-icon icon="solar:arrow-left-bold" width="24" class="text-love-accent"></iconify-icon></button>
                                <span class="font-bold text-xs truncate" x-text="selectedUni.name"></span>
                            </header>
                            <div class="divide-y divide-love-soft/10">
                                <template x-for="stu in studentsOfUni" :key="stu.id">
                                    <div @click="openChat(stu)" class="p-4 flex items-center gap-4 hover:bg-love-soft/10 cursor-pointer">
                                        <div class="w-12 h-12 rounded-full border border-love-accent overflow-hidden shadow-sm">
                                            <img :src="stu.avatar_url || 'https://api.dicebear.com/7.x/adventurer/svg?seed='+stu.full_name" class="w-full h-full object-cover">
                                        </div>
                                        <span class="font-bold text-sm" x-text="stu.full_name"></span>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </template>
                </div>

                <!-- SECRETS -->
                <div x-show="activeTab === 'secrets'" class="p-6 space-y-4">
                    <template x-for="sec in secrets" :key="sec.id">
                        <div class="bg-white p-6 rounded-[2rem] shadow-sm border-b-4 border-love-soft">
                            <p class="text-sm italic text-love-text" x-text="sec.content"></p>
                            <span class="text-[9px] opacity-20 mt-4 block font-bold text-right uppercase">🤫 Anonyme</span>
                        </div>
                    </template>
                </div>

                <!-- PARAMETRES -->
                <div x-show="activeTab === 'settings'" class="p-6 space-y-6">
                    <div class="flex flex-col items-center">
                        <label class="relative cursor-pointer">
                            <input type="file" @change="updateProfilePhoto" class="hidden" accept="image/*">
                            <div class="w-32 h-32 rounded-[2.5rem] border-4 border-love-accent overflow-hidden shadow-xl">
                                <img :src="profile?.avatar_url || 'https://api.dicebear.com/7.x/adventurer/svg?seed='+profile?.full_name" class="w-full h-full object-cover">
                            </div>
                            <div class="absolute bottom-0 right-0 bg-love-accent text-white p-2 rounded-full border-4 border-white shadow-lg"><iconify-icon icon="solar:camera-bold"></iconify-icon></div>
                        </label>
                        <h2 class="mt-4 text-xl font-bold" x-text="profile?.full_name"></h2>
                        <p class="text-[10px] font-black text-love-accent uppercase" x-text="profile?.university"></p>
                    </div>
                    <div class="space-y-4">
                        <div class="bg-white p-4 rounded-2xl shadow-sm border border-love-soft">
                            <p class="text-[10px] font-bold text-slate-400 uppercase">Modifier mon nom</p>
                            <input type="text" x-model="profile.full_name" @blur="saveProfile" class="w-full font-bold outline-none mt-1">
                        </div>
                        <div class="bg-white p-4 rounded-2xl shadow-sm border border-love-soft">
                            <p class="text-[10px] font-bold text-slate-400 uppercase">Numéro WhatsApp</p>
                            <input type="text" x-model="profile.phone" @blur="saveProfile" placeholder="+243..." class="w-full font-bold outline-none mt-1">
                        </div>
                        <button @click="signOut" class="w-full p-4 bg-white text-red-500 font-bold rounded-2xl border border-red-50 flex items-center justify-between">Se déconnecter <iconify-icon icon="solar:logout-bold"></iconify-icon></button>
                        <button @click="deleteAccount" class="w-full p-4 text-slate-300 text-[10px] font-bold uppercase tracking-widest text-center mt-10">Supprimer mon compte définitivement</button>
                    </div>
                </div>
            </main>

            <!-- BOUTONS FLOTTANTS -->
            <div class="fixed bottom-24 right-6 flex flex-col gap-3 z-50" x-show="activeTab !== 'settings'">
                <template x-if="activeTab === 'actus'"><label class="w-14 h-14 bg-love-accent text-white rounded-2xl shadow-xl flex items-center justify-center cursor-pointer active:scale-90 transition-transform"><input type="file" @change="uploadStatus" class="hidden" accept="image/*"><iconify-icon icon="solar:camera-bold" width="28"></iconify-icon></label></template>
                <template x-if="activeTab === 'secrets'"><button @click="openSecret" class="w-14 h-14 bg-love-accent text-white rounded-2xl shadow-xl flex items-center justify-center active:scale-90 transition-transform"><iconify-icon icon="solar:pen-bold" width="28"></iconify-icon></button></template>
            </div>

            <!-- NAVIGATION BAS -->
            <nav class="fixed bottom-0 w-full bg-white border-t border-love-soft grid grid-cols-4 pb-2 z-[60]">
                <button @click="activeTab = 'chats'" class="flex flex-col items-center py-3" :class="activeTab === 'chats' ? 'text-love-accent' : 'text-slate-400'"><iconify-icon icon="solar:chat-round-dots-bold" width="24"></iconify-icon><span class="text-[9px] font-bold">Chats</span></button>
                <button @click="activeTab = 'actus'" class="flex flex-col items-center py-3" :class="activeTab === 'actus' ? 'text-love-accent' : 'text-slate-400'"><iconify-icon icon="solar:star-circle-bold" width="24"></iconify-icon><span class="text-[9px] font-bold">Actus</span></button>
                <button @click="activeTab = 'campus'" class="flex flex-col items-center py-3" :class="activeTab === 'campus' ? 'text-love-accent' : 'text-slate-400'"><iconify-icon icon="solar:users-group-rounded-bold" width="24"></iconify-icon><span class="text-[9px] font-bold">Campus</span></button>
                <button @click="activeTab = 'secrets'" class="flex flex-col items-center py-3" :class="activeTab === 'secrets' ? 'text-love-accent' : 'text-slate-400'"><iconify-icon icon="solar:mask-happly-bold" width="24"></iconify-icon><span class="text-[9px] font-bold">Secrets</span></button>
            </nav>

            <!-- CHAT PRIVÉ -->
            <div x-show="activeChat" class="fixed inset-0 bg-white z-[1000] flex flex-col">
                <header class="p-4 bg-white border-b border-love-soft flex items-center gap-4">
                    <button @click="activeChat = null"><iconify-icon icon="solar:arrow-left-bold" width="24" class="text-love-accent"></iconify-icon></button>
                    <p class="font-bold text-sm flex-1" x-text="activeChat?.full_name"></p>
                </header>
                <div class="flex-1 overflow-y-auto p-4 space-y-4" id="cbox">
                    <template x-for="m in messages" :key="m.id">
                        <div class="flex" :class="m.sender_id === session.user.id ? 'justify-end' : 'justify-start'">
                            <div class="p-4 rounded-[2rem] text-sm max-w-[85%] shadow-sm" :class="m.sender_id === session.user.id ? 'bg-love-accent text-white rounded-tr-none' : 'bg-love-soft/30 text-love-text border rounded-tl-none border-love-soft'">
                                <p x-text="m.content"></p>
                            </div>
                        </div>
                    </template>
                </div>
                <div class="p-4 bg-white flex gap-2">
                    <input type="text" x-model="newMessage" @keyup.enter="sendMessage" placeholder="Message..." class="flex-1 bg-love-soft/30 p-4 rounded-full outline-none text-sm border-none shadow-inner">
                    <button @click="sendMessage" class="w-14 h-14 bg-love-accent text-white rounded-full flex items-center justify-center active:scale-90 transition-all"><iconify-icon icon="solar:paper-plane-bold" width="22"></iconify-icon></button>
                </div>
            </div>
        </div>
    </div>
    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.data('kelvinApp', () => ({
                session: null, 
                activeTab: 'chats', 
                activeChat: null, 
                mode: 'login',
                universities: [], 
                chatList: [], 
                stories: [], 
                secrets: [], 
                messages: [],
                selectedUni: null, 
                studentsOfUni: [], 
                newMessage: '', 
                loadingScreen: true,
                form: { name: '', email: '', password: '', university: '' }, 
                profile: { full_name: '', avatar_url: '', phone: '' },

                async init() {
                    // Sécurité : on retire le loader quoi qu'il arrive après 1.5s
                    setTimeout(() => { this.loadingScreen = false }, 1500);

                    // Vérification de la session
                    const { data } = await sb.auth.getSession();
                    this.session = data.session;
                    
                    this.loadData();
                    
                    if (this.session) {
                        await this.loadProfile();
                        this.updateLocation();
                        // Rafraîchir les statuts pour avoir les noms
                        this.loadStories();
                    }
                    this.loadingScreen = false;
                },

                async handleAuth() {
                    try {
                        if (this.mode === 'signup') {
                            const { data, error } = await sb.auth.signUp({ 
                                email: this.form.email, 
                                password: this.form.password 
                            });
                            if (error) throw error;
                            // Enregistrement immédiat du nom et de l'université
                            await sb.from('profiles').update({ 
                                full_name: this.form.name, 
                                university: this.form.university 
                            }).eq('id', data.user.id);
                            alert("Compte créé ! Vérifie tes emails pour confirmer.");
                        } else {
                            const { error } = await sb.auth.signInWithPassword({ 
                                email: this.form.email, 
                                password: this.form.password 
                            });
                            if (error) throw error;
                            location.reload();
                        }
                    } catch (e) { alert(e.message); }
                },

                async loadData() {
                    // Charger les universités
                    sb.from('universities').select('*').order('name').then(({data}) => this.universities = data || []);
                    
                    // Charger la liste globale des étudiants (Discussions)
                    sb.from('profiles').select('*').limit(50).then(({data}) => {
                        if(data) {
                            this.chatList = data.filter(u => u.id !== this.session?.user?.id).map(u => ({
                                ...u,
                                distance: this.calcDist(this.profile?.latitude, this.profile?.longitude, u.latitude, u.longitude).toFixed(1)
                            }));
                        }
                    });

                    // Charger les secrets
                    sb.from('secrets').select('*').order('created_at', {ascending: false}).then(({data}) => this.secrets = data || []);
                    
                    // Charger les statuts
                    this.loadStories();
                },

                async loadStories() {
                    // On récupère les publications et on cherche le nom de l'auteur pour chaque
                    const { data } = await sb.from('stories').select('*').order('created_at', {ascending: false});
                    if (data) {
                        const updatedStories = [];
                        for (let s of data) {
                            const { data: p } = await sb.from('profiles').select('full_name').eq('id', s.user_id).single();
                            s.author_name = p ? p.full_name : 'Étudiant';
                            updatedStories.push(s);
                        }
                        this.stories = updatedStories;
                    }
                },

                async viewUni(uni) {
                    this.selectedUni = uni;
                    // On cherche les étudiants qui ont EXACTEMENT le nom de cette université
                    const { data } = await sb.from('profiles')
                        .select('*')
                        .eq('university', uni.name);
                    this.studentsOfUni = data || [];
                },

                async uploadStatus(e) {
                    const f = e.target.files[0];
                    if (!f) return;
                    const fileName = `status/${this.session.user.id}-${Date.now()}.png`;
                    
                    const { data, error } = await sb.storage.from('avatars').upload(fileName, f);
                    if (!error) {
                        const { data: { publicUrl } } = sb.storage.from('avatars').getPublicUrl(fileName);
                        const cap = prompt("Légende de ta publication :");
                        await sb.from('stories').insert({ 
                            user_id: this.session.user.id, 
                            photo_url: publicUrl, 
                            caption: cap || "" 
                        });
                        this.loadStories();
                    } else { alert("Erreur : " + error.message); }
                },

                async deleteStory(id) {
                    if(confirm("Supprimer cette publication définitivement ?")) {
                        await sb.from('stories').delete().eq('id', id);
                        this.loadStories();
                    }
                },

                async updateProfilePhoto(e) {
                    const f = e.target.files[0];
                    if (!f) return;
                    const fileName = `profile/${this.session.user.id}.png`;
                    // upsert: true permet d'écraser l'ancienne photo
                    const { data, error } = await sb.storage.from('avatars').upload(fileName, f, { upsert: true });
                    
                    if (!error) {
                        const { data: { publicUrl } } = sb.storage.from('avatars').getPublicUrl(fileName);
                        this.profile.avatar_url = publicUrl;
                        await sb.from('profiles').update({ avatar_url: publicUrl }).eq('id', this.session.user.id);
                        alert("Photo de profil mise à jour !");
                    }
                },

                async loadProfile() {
                    const { data } = await sb.from('profiles').select('*').eq('id', this.session.user.id).single();
                    if(data) this.profile = data;
                },

                async saveProfile() {
                    await sb.from('profiles').update({ 
                        full_name: this.profile.full_name,
                        phone: this.profile.phone 
                    }).eq('id', this.session.user.id);
                },

                async openChat(user) {
                    this.activeChat = user;
                    const { data } = await sb.from('messages')
                        .select('*')
                        .or(`and(sender_id.eq.${this.session.user.id},receiver_id.eq.${user.id}),and(sender_id.eq.${user.id},receiver_id.eq.${this.session.user.id})`)
                        .order('created_at');
                    this.messages = data || [];
                    // Scroll automatique vers le bas
                    setTimeout(() => { const el = document.getElementById('cbox'); if(el) el.scrollTop = el.scrollHeight; }, 100);
                },

                async sendMessage() {
                    if (!this.newMessage.trim()) return;
                    await sb.from('messages').insert({ 
                        sender_id: this.session.user.id, 
                        receiver_id: this.activeChat.id, 
                        content: this.newMessage 
                    });
                    this.newMessage = ''; 
                    this.openChat(this.activeChat);
                },

                async openSecret() {
                    const c = prompt("Écris ton secret anonyme (il sera visible par tout le campus) :");
                    if (c && c.trim()) {
                        await sb.from('secrets').insert({ content: c });
                        this.loadData();
                    }
                },

                calcDist(lat1, lon1, lat2, lon2) {
                    if (!lat1 || !lat2) return 0;
                    const R = 6371;
                    const dLat = (lat2-lat1) * Math.PI/180;
                    const dLon = (lon2-lon1) * Math.PI/180;
                    const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLon/2)*Math.sin(dLon/2);
                    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
                },

                async updateLocation() {
                    navigator.geolocation.getCurrentPosition(async (p) => {
                        await sb.from('profiles').update({ 
                            latitude: p.coords.latitude, 
                            longitude: p.coords.longitude,
                            last_seen: new Date() 
                        }).eq('id', this.session.user.id);
                    });
                },

                async deleteAccount() {
                    if(confirm("⚠️ ATTENTION : Ton compte, tes messages et tes photos seront supprimés définitivement. Continuer ?")) {
                        await sb.rpc('delete_user_account');
                        await sb.auth.signOut();
                        location.reload();
                    }
                },

                async signOut() { 
                    await sb.auth.signOut(); 
                    location.reload(); 
                }
            }));
        });
    </script>
</body>
</html>
