    <style>
        body { background-color: #FFF9F9; color: #4A3B3B; font-family: 'Outfit', sans-serif; margin: 0; -webkit-tap-highlight-color: transparent; }
        .tab-active { color: #D988B9; border-bottom: 3px solid #D988B9; }
        #loader { position: fixed; inset: 0; background: #FFF9F9; display: flex; align-items: center; justify-content: center; z-index: 9999; }
        [x-cloak] { display: none !important; }
        .guide-step { animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

</head>
<body x-data="kelvinApp">

    <div id="loader" x-show="loadingScreen">
        <iconify-icon icon="line-md:loading-twotone-loop" style="font-size:50px; color:#D988B9;"></iconify-icon>
    </div>

    <!-- GUIDE UTILISATEUR (Modal de bienvenue) -->
    <div x-show="showGuide" x-cloak class="fixed inset-0 z-[2000] bg-black/60 backdrop-blur-sm flex items-center justify-center p-6">
        <div class="bg-white w-full max-w-sm rounded-[2.5rem] p-8 text-center relative shadow-2xl">
            <div class="w-20 h-20 bg-love-soft rounded-full mx-auto mb-4 flex items-center justify-center text-love-accent text-4xl">
                <iconify-icon icon="solar:magic-stick-3-bold"></iconify-icon>
            </div>
            <h2 class="text-xl font-extrabold mb-2">Bienvenue sur Campus Lushi !</h2>
            <p class="text-slate-400 text-sm mb-6">Laisse-moi te montrer comment fonctionne ton nouveau réseau.</p>
            
            <div class="space-y-4 text-left mb-8">
                <div class="flex items-center gap-3">
                    <iconify-icon icon="solar:users-group-rounded-bold" class="text-love-accent"></iconify-icon>
                    <p class="text-xs font-bold">Campus: Clique sur une université pour voir tes futurs amis.</p>
                </div>
                <div class="flex items-center gap-3">
                    <iconify-icon icon="solar:mask-happly-bold" class="text-love-accent"></iconify-icon>
                    <p class="text-xs font-bold">Secrets: Partage tes confessions sans qu'on sache qui tu es.</p>
                </div>
                <div class="flex items-center gap-3">
                    <iconify-icon icon="solar:map-point-bold" class="text-love-accent"></iconify-icon>
                    <p class="text-xs font-bold">Distance: Découvre qui est à moins d'un km de toi !</p>
                </div>
            </div>

            <button @click="closeGuide" class="w-full py-4 bg-love-accent text-white font-bold rounded-2xl shadow-lg">C'est parti !</button>
        </div>
    </div>

    <div x-cloak x-show="!loadingScreen">
        
        <!-- 1. AUTH (Formulaire complet) -->
        <div x-show="!session" class="h-screen flex flex-col items-center justify-center p-8 text-center bg-[#FFF5F5]">
            <div class="w-20 h-20 bg-love-accent rounded-[2rem] mb-6 flex items-center justify-center shadow-lg">
                <iconify-icon icon="solar:heart-bold" class="text-white text-4xl"></iconify-icon>
            </div>
            <h1 class="text-3xl font-bold mb-8">Kelvin Loving</h1>
            <div class="w-full max-w-sm space-y-4">
                <template x-if="mode === 'signup'">
                    <div class="space-y-3 animate-in fade-in">
                        <input type="text" x-model="form.name" placeholder="Prénom & Nom" class="w-full p-4 bg-white rounded-2xl shadow-sm outline-none">
                        <div class="flex gap-2">
                            <select x-model="form.gender" class="flex-1 p-4 bg-white rounded-2xl shadow-sm text-sm outline-none">
                                <option value="">Sexe...</option>
                                <option value="Fille">Fille 🚺</option>
                                <option value="Garçon">Garçon 🚹</option>
                            </select>
                            <input type="number" x-model="form.age" placeholder="Âge" class="w-20 p-4 bg-white rounded-2xl shadow-sm outline-none">
                        </div>
                        <select x-model="form.university" class="w-full p-4 bg-white rounded-2xl shadow-sm outline-none text-sm">
                            <option value="">Ton établissement...</option>
                            <template x-for="u in universities" :key="u.id"><option :value="u.name" x-text="u.name"></option></template>
                        </select>
                    </div>
                </template>
                <input type="email" x-model="form.email" placeholder="Email" class="w-full p-4 bg-white rounded-2xl shadow-sm border-none outline-none">
                <input type="password" x-model="form.password" placeholder="Mot de passe" class="w-full p-4 bg-white rounded-2xl shadow-sm border-none outline-none">
                <button @click="handleAuth" class="w-full bg-love-accent text-white font-bold py-4 rounded-2xl shadow-lg">Continuer</button>
                <button @click="mode = (mode === 'signup' ? 'login' : 'signup')" class="text-xs text-love-accent font-bold mt-4 underline" x-text="mode === 'signup' ? 'J\'ai déjà un compte' : 'Nouveau ? Crée un compte'"></button>
            </div>
        </div>

        <!-- 2. APPLICATION (Interface WhatsApp) -->
        <div x-show="session" class="h-screen flex flex-col overflow-hidden">
            <header class="p-4 flex justify-between items-center bg-white shadow-sm sticky top-0 z-50">
                <h1 class="text-2xl font-bold text-love-accent italic">WhatsApp</h1>
                <div class="flex gap-4 items-center">
                    <iconify-icon icon="solar:magnifer-bold" width="24" class="text-slate-400"></iconify-icon>
                    <button @click="activeTab = 'settings'" class="w-10 h-10 rounded-full border-2 border-love-accent overflow-hidden">
                        <img :src="profile?.avatar_url || 'https://api.dicebear.com/7.x/adventurer/svg?seed='+profile?.full_name" class="w-full h-full object-cover">
                    </button>
                </div>
            </header>

            <nav class="flex bg-white border-b border-love-soft z-40" x-show="activeTab !== 'settings'">
                <button @click="activeTab = 'chats'" class="flex-1 py-4 text-[10px] font-bold uppercase text-center" :class="activeTab === 'chats' ? 'tab-active' : 'text-slate-400'">Discussions</button>
                <button @click="activeTab = 'actus'" class="flex-1 py-4 text-[10px] font-bold uppercase text-center" :class="activeTab === 'actus' ? 'tab-active' : 'text-slate-400'">Actus</button>
                <button @click="activeTab = 'campus'" class="flex-1 py-4 text-[10px] font-bold uppercase text-center" :class="activeTab === 'campus' ? 'tab-active' : 'text-slate-400'">Campus</button>
                <button @click="activeTab = 'secrets'" class="flex-1 py-4 text-[10px] font-bold uppercase text-center" :class="activeTab === 'secrets' ? 'tab-active' : 'text-slate-400'">Secrets</button>
            </nav>

            <main class="flex-1 overflow-y-auto pb-24">
                <!-- LE CONTENU DES ONGLETS (ACTUS, CHATS, CAMPUS, SECRETS, SETTINGS) -->
                <!-- Je n'ai pas modifié ton code ici pour que ça reste "comme avant" -->
            </main>
            
            <!-- BARRE BAS ET MODALS CHATS RESTENT IDENTIQUES... -->
        </div>
                        </div>
                        <script>
        document.addEventListener('alpine:init', () => {
            Alpine.data('kelvinApp', () => ({
                session: null, activeTab: 'chats', activeChat: null, mode: 'login',
                universities: [], chatList: [], stories: [], secrets: [], messages: [],
                selectedUni: null, studentsOfUni: [], newMessage: '', loadingScreen: true,
                showGuide: false,
                form: { name: '', email: '', password: '', university: '', gender: '', age: '', lat: null, lng: null },
                profile: { full_name: '', avatar_url: '', university: '', gender: '', age: '' },

                async init() {
                    const { data } = await sb.auth.getSession();
                    this.session = data.session;
                    
                    // Vérifier si c'est la première fois pour le GUIDE
                    if (this.session && !localStorage.getItem('guide_done')) {
                        this.showGuide = true;
                    }

                    this.loadingScreen = false;
                    this.loadData();
                    if (this.session) {
                        await this.loadProfile();
                        this.updateStatusAndGPS();
                    }
                },

                // INSCRIPTION AVEC AGE, SEXE ET GPS
                async handleAuth() {
                    try {
                        if (this.mode === 'signup') {
                            // On essaie de choper le GPS avant tout
                            await this.getGPS();

                            const { data, error } = await sb.auth.signUp({ 
                                email: this.form.email, 
                                password: this.form.password 
                            });
                            if (error) throw error;

                            // SAUVEGARDE DANS PROFILES
                            await sb.from('profiles').update({ 
                                full_name: this.form.name, 
                                university: this.form.university,
                                gender: this.form.gender,
                                age: parseInt(this.form.age),
                                latitude: this.form.lat,
                                longitude: this.form.lng
                            }).eq('id', data.user.id);

                            alert("Inscription réussie !");
                        } else {
                            await sb.auth.signInWithPassword({ email: this.form.email, password: this.form.password });
                            location.reload();
                        }
                    } catch (e) { alert(e.message) }
                },

                async getGPS() {
                    return new Promise((resolve) => {
                        if (!navigator.geolocation) return resolve();
                        navigator.geolocation.getCurrentPosition((p) => {
                            this.form.lat = p.coords.latitude;
                            this.form.lng = p.coords.longitude;
                            resolve();
                        }, () => resolve());
                    });
                },

                async updateStatusAndGPS() {
                    navigator.geolocation.getCurrentPosition(async (p) => {
                        await sb.from('profiles').update({ 
                            latitude: p.coords.latitude, 
                            longitude: p.coords.longitude,
                            last_seen: new Date()
                        }).eq('id', this.session.user.id);
                    });
                },

                closeGuide() {
                    this.showGuide = false;
                    localStorage.setItem('guide_done', 'true');
                },

                // (Garde tes fonctions loadData, viewUni, openChat, etc. ici)
                
                async signOut() { await sb.auth.signOut(); location.reload(); }
            }));
        });
    </script>
</body>
</html>
