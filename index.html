<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kelvin Loving | Campus</title>
    
    <!-- Scripts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">

    <script>
        const S_URL = 'https://oemqhxmmoxykrqqhwnqq.supabase.co';
        const S_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9lbXFoeG1tb3h5a3JxcWh3bnFxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU3OTM3MzksImV4cCI6MjEwMTM2OTczOX0.F7lVdMft0gQEyGiQYrnE5BMaTcu3nxMQa8D1CX0icbQ';
        const sb = supabase.createClient(S_URL, S_KEY);

        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        love: { base: '#FFF9F9', soft: '#F8E7E7', accent: '#D988B9', text: '#4A3B3B' }
                    }
                }
            }
        }
    </script>

    <style>
        [x-cloak] { display: none !important; }
        body { background-color: #FFF9F9; color: #4A3B3B; font-family: 'Outfit', sans-serif; -webkit-tap-highlight-color: transparent; }
        .tab-active { color: #D988B9; border-bottom: 3px solid #D988B9; }
        #loader { position: fixed; inset: 0; background: #FFF9F9; display: flex; align-items: center; justify-content: center; z-index: 9999; }
    </style>
</head>
<body x-data="whatsappApp">

    <!-- Écran de chargement -->
    <div id="loader" x-show="loadingScreen">
        <iconify-icon icon="line-md:loading-twotone-loop" style="font-size:50px; color:#D988B9;"></iconify-icon>
    </div>

    <div x-cloak x-show="!loadingScreen">
        
        <!-- 1. CONNEXION -->
        <template x-if="!session">
            <div class="h-screen flex flex-col items-center justify-center p-8 text-center bg-[#FFF5F5]">
                <div class="w-20 h-20 bg-love-accent rounded-[2rem] mb-6 flex items-center justify-center shadow-lg">
                    <iconify-icon icon="solar:heart-bold" class="text-white text-4xl"></iconify-icon>
                </div>
                <h1 class="text-3xl font-bold mb-8 text-love-text">Kelvin Loving</h1>
                <div class="w-full max-w-sm space-y-4">
                    <template x-if="mode === 'signup'">
                        <div class="space-y-4">
                            <input type="text" x-model="form.name" placeholder="Nom Complet" class="w-full p-4 bg-white rounded-2xl shadow-sm outline-none border-none">
                            <select x-model="form.university" class="w-full p-4 bg-white rounded-2xl shadow-sm outline-none border-none">
                                <option value="">Ton université...</option>
                                <template x-for="u in universities" :key="u.id"><option :value="u.name" x-text="u.name"></option></template>
                            </select>
                        </div>
                    </template>
                    <input type="email" x-model="form.email" placeholder="Email" class="w-full p-4 bg-white rounded-2xl shadow-sm border-none outline-none">
                    <input type="password" x-model="form.password" placeholder="Mot de passe" class="w-full p-4 bg-white rounded-2xl shadow-sm border-none outline-none">
                    <button @click="handleAuth" class="w-full bg-love-accent text-white font-bold py-4 rounded-2xl shadow-lg active:scale-95 transition-all">Continuer</button>
                    <button @click="mode = (mode === 'signup' ? 'login' : 'signup')" class="text-xs text-love-accent font-bold mt-4" x-text="mode === 'signup' ? 'Déjà un compte ? Connexion' : 'Pas de compte ? Créer'"></button>
                </div>
            </div>
        </template>

        <!-- 2. INTERFACE WHATSAPP -->
        <template x-if="session">
            <div class="h-screen flex flex-col">
                <!-- Header -->
                <header class="p-4 flex justify-between items-center bg-white sticky top-0 z-50">
                    <h1 class="text-2xl font-bold text-love-text">WhatsApp</h1>
                    <div class="flex gap-4 text-slate-400">
                        <iconify-icon icon="solar:magnifer-bold" width="24"></iconify-icon>
                        <iconify-icon icon="solar:menu-dots-vertical-bold" width="24" @click="signOut"></iconify-icon>
                    </div>
                </header>

                <!-- Navigation Onglets -->
                <nav class="flex bg-white border-b border-love-soft sticky top-[65px] z-40">
                    <button @click="activeTab = 'chats'; selectedUni = null" class="flex-1 py-4 text-[10px] font-bold uppercase" :class="activeTab === 'chats' ? 'tab-active' : 'text-slate-400'">Discussions</button>
                    <button @click="activeTab = 'actus'; selectedUni = null" class="flex-1 py-4 text-[10px] font-bold uppercase" :class="activeTab === 'actus' ? 'tab-active' : 'text-slate-400'">Actus</button>
                    <button @click="activeTab = 'campus'; selectedUni = null" class="flex-1 py-4 text-[10px] font-bold uppercase" :class="activeTab === 'campus' ? 'tab-active' : 'text-slate-400'">Campus</button>
                    <button @click="activeTab = 'secrets'; selectedUni = null" class="flex-1 py-4 text-[10px] font-bold uppercase" :class="activeTab === 'secrets' ? 'tab-active' : 'text-slate-400'">Secrets</button>
                </nav>

                <main class="flex-1 overflow-y-auto pb-24">
                    
                    <!-- DISCUSSIONS -->
                    <div x-show="activeTab === 'chats'">
                        <template x-for="chat in chatList" :key="chat.id">
                            <div @click="openChat(chat)" class="flex items-center gap-4 p-4 border-b border-love-soft/20 cursor-pointer hover:bg-love-soft/10">
                                <div class="w-14 h-14 rounded-full border-2 border-white shadow-sm bg-love-soft overflow-hidden"><img :src="'https://api.dicebear.com/7.x/adventurer/svg?seed='+chat.full_name" class="w-full h-full"></div>
                                <div class="flex-1 min-w-0"><h3 class="font-bold text-sm" x-text="chat.full_name"></h3><p class="text-[10px] text-slate-400 truncate" x-text="chat.university"></p></div>
                            </div>
                        </template>
                    </div>

                    <!-- ACTUS -->
                    <div x-show="activeTab === 'actus'" class="p-4">
                        <div class="flex items-center gap-4 mb-6">
                            <label class="relative w-14 h-14 bg-love-soft rounded-full flex items-center justify-center border-2 border-love-accent border-dashed cursor-pointer">
                                <input type="file" @change="uploadStatus" class="hidden" accept="image/*">
                                <iconify-icon icon="solar:camera-bold" class="text-love-accent text-xl"></iconify-icon>
                                <div class="absolute bottom-0 right-0 bg-love-accent text-white rounded-full w-5 h-5 flex items-center justify-center font-bold text-[8px]">+</div>
                            </label>
                            <div><p class="font-bold text-sm">Mon statut</p><p class="text-xs text-slate-400">Publier une actu photo</p></div>
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <template x-for="story in stories" :key="story.id">
                                <div class="h-64 rounded-3xl relative overflow-hidden shadow-md bg-love-soft">
                                    <img :src="story.photo_url" class="w-full h-full object-cover">
                                    <div class="absolute bottom-0 p-3 bg-black/40 w-full"><p class="text-white text-[10px] font-medium" x-text="story.caption"></p></div>
                                </div>
                            </template>
                        </div>
                    </div>

                    <!-- CAMPUS -->
                    <div x-show="activeTab === 'campus'">
                        <template x-if="!selectedUni">
                            <div>
                                <template x-for="uni in universities" :key="uni.id">
                                    <div @click="viewUni(uni)" class="p-4 border-b border-love-soft/10 flex items-center gap-4 hover:bg-love-soft/20 cursor-pointer">
                                        <div class="w-10 h-10 bg-love-soft rounded-xl flex items-center justify-center text-love-accent font-black">L</div>
                                        <span class="text-sm font-bold" x-text="uni.name"></span>
                                    </div>
                                </template>
                            </div>
                        </template>
                        <template x-if="selectedUni">
                            <div class="animate-in slide-in-from-right">
                                <header class="p-4 bg-love-soft/30 flex items-center gap-4">
                                    <button @click="selectedUni = null"><iconify-icon icon="solar:arrow-left-bold" width="24" class="text-love-accent"></iconify-icon></button>
                                    <span class="font-bold text-xs truncate" x-text="selectedUni.name"></span>
                                </header>
                                <template x-for="stu in studentsOfUni" :key="stu.id">
                                    <div @click="openChat(stu)" class="p-4 border-b border-love-soft/10 flex items-center gap-4 cursor-pointer hover:bg-love-soft/10">
                                        <div class="w-12 h-12 rounded-full overflow-hidden border bg-white"><img :src="'https://api.dicebear.com/7.x/adventurer/svg?seed='+stu.full_name" class="w-full h-full"></div>
                                        <span class="font-bold text-sm" x-text="stu.full_name"></span>
                                    </div>
                                </template>
                            </div>
                        </template>
                    </div>

                    <!-- SECRETS -->
                    <div x-show="activeTab === 'secrets'" class="p-6 space-y-4">
                        <template x-for="sec in secrets" :key="sec.id">
                            <div class="bg-white p-6 rounded-[2rem] shadow-sm border-b-4 border-love-soft">
                                <p class="text-sm italic text-love-text" x-text="sec.content"></p>
                                <span class="text-[9px] opacity-20 mt-4 block font-bold uppercase tracking-widest text-right">🤫 Anonyme</span>
                            </div>
                        </template>
                    </div>
                </main>

                <!-- BOUTONS FLOTTANTS -->
                <div class="fixed bottom-24 right-6 flex flex-col gap-3 z-50">
                    <template x-if="activeTab === 'actus'">
                        <label class="w-14 h-14 bg-love-accent text-white rounded-2xl shadow-xl flex items-center justify-center cursor-pointer active:scale-90 transition-transform">
                            <input type="file" @change="uploadStatus" class="hidden" accept="image/*">
                            <iconify-icon icon="solar:camera-bold" width="28"></iconify-icon>
                        </label>
                    </template>
                    <template x-if="activeTab === 'secrets'">
                        <button @click="openSecret" class="w-14 h-14 bg-love-accent text-white rounded-2xl shadow-xl flex items-center justify-center active:scale-90 transition-transform">
                            <iconify-icon icon="solar:pen-bold" width="28"></iconify-icon>
                        </button>
                    </template>
                </div>

                <!-- NAVIGATION BAS -->
                <nav class="fixed bottom-0 w-full bg-white border-t border-love-soft grid grid-cols-4 pb-2 z-[60]">
                    <button @click="activeTab = 'chats'" class="flex flex-col items-center py-3" :class="activeTab === 'chats' ? 'text-love-accent' : 'text-slate-400'"><iconify-icon icon="solar:chat-round-dots-bold" width="24"></iconify-icon><span class="text-[9px] font-bold">Chats</span></button>
                    <button @click="activeTab = 'actus'" class="flex flex-col items-center py-3" :class="activeTab === 'actus' ? 'text-love-accent' : 'text-slate-400'"><iconify-icon icon="solar:star-circle-bold" width="24"></iconify-icon><span class="text-[9px] font-bold">Actus</span></button>
                    <button @click="activeTab = 'campus'" class="flex flex-col items-center py-3" :class="activeTab === 'campus' ? 'text-love-accent' : 'text-slate-400'"><iconify-icon icon="solar:users-group-rounded-bold" width="24"></iconify-icon><span class="text-[9px] font-bold">Campus</span></button>
                    <button @click="activeTab = 'secrets'" class="flex flex-col items-center py-3" :class="activeTab === 'secrets' ? 'text-love-accent' : 'text-slate-400'"><iconify-icon icon="solar:mask-happly-bold" width="24"></iconify-icon><span class="text-[9px] font-bold">Secrets</span></button>
                </nav>

                <!-- CHAT PRIVÉ -->
                <div x-show="activeChat" x-cloak class="fixed inset-0 bg-love-base z-[1000] flex flex-col">
                    <header class="p-4 bg-white border-b border-love-soft flex items-center gap-4">
                        <button @click="activeChat = null"><iconify-icon icon="solar:arrow-left-bold" width="24" class="text-love-accent"></iconify-icon></button>
                        <p class="font-bold text-sm" x-text="activeChat?.full_name"></p>
                    </header>
                    <div class="flex-1 overflow-y-auto p-4 space-y-4" id="chat-box">
                        <template x-for="m in messages" :key="m.id">
                            <div class="flex" :class="m.sender_id === session.user.id ? 'justify-end' : 'justify-start'">
                                <div class="p-4 rounded-[2rem] text-sm max-w-[85%] shadow-sm" :class="m.sender_id === session.user.id ? 'bg-love-accent text-white rounded-tr-none' : 'bg-white text-love-text border rounded-tl-none'">
                                    <p x-text="m.content"></p>
                                </div>
                            </div>
                        </template>
                    </div>
                    <div class="p-4 bg-white flex gap-2">
                        <input type="text" x-model="newMessage" @keyup.enter="sendMessage" placeholder="Message..." class="flex-1 bg-love-soft p-4 rounded-full outline-none text-sm border-none shadow-inner">
                        <button @click="sendMessage" class="w-14 h-14 bg-love-accent text-white rounded-full flex items-center justify-center shadow-lg transition-all"><iconify-icon icon="solar:paper-plane-bold" width="22"></iconify-icon></button>
                    </div>
                </div>
            </div>
        </template>
    </div>

    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.data('whatsappApp', () => ({
                session: null, activeTab: 'chats', activeChat: null, mode: 'login',
                profile: null, chatList: [], universities: [], secrets: [], stories: [], messages: [], 
                loadingScreen: true, newMessage: '',
                selectedUni: null, studentsOfUni: [],
                form: { name: '', email: '', password: '', university: '' },

                async init() {
                    const { data } = await sb.auth.getSession();
                    this.session = data.session;
                    this.loadingScreen = false;
                    this.loadInitial();
                    if (this.session) this.loadProfile();
                },

                async handleAuth() {
                    try {
                        if (this.mode === 'signup') {
                            const { data, error } = await sb.auth.signUp({ email: this.form.email, password: this.form.password });
                            if (error) throw error;
                            await sb.from('profiles').update({ full_name: this.form.name, university: this.form.university }).eq('id', data.user.id);
                            alert("Compte créé !");
                        } else {
                            const { error } = await sb.auth.signInWithPassword({ email: this.form.email, password: this.form.password });
                            if (error) throw error;
                            location.reload();
                        }
                    } catch (e) { alert(e.message); }
                },

                async loadInitial() {
                    // Chargement séparé pour éviter que tout plante
                    sb.from('universities').select('*').order('name').then(({data}) => this.universities = data || []);
                    sb.from('profiles').select('*').limit(50).then(({data}) => this.chatList = data || []);
                    sb.from('stories').select('*').order('created_at', {ascending: false}).then(({data}) => this.stories = data || []);
                    sb.from('secrets').select('*').order('created_at', {ascending: false}).then(({data}) => this.secrets = data || []);
                },

                async viewUni(uni) {
                    this.selectedUni = uni;
                    const { data } = await sb.from('profiles').select('*').eq('university', uni.name);
                    this.studentsOfUni = data || [];
                },

                async uploadStatus(e) {
                    const file = e.target.files[0];
                    if (!file) return;
                    const fileName = `${Date.now()}-${file.name}`;
                    const { data, error } = await sb.storage.from('avatars').upload(fileName, file);
                    if (error) return alert("Erreur upload: " + error.message);
                    const { data: { publicUrl } } = sb.storage.from('avatars').getPublicUrl(fileName);
                    const cap = prompt("Légende :");
                    await sb.from('stories').insert({ user_id: this.session.user.id, photo_url: publicUrl, caption: cap || "" });
                    location.reload();
                },

                async openSecret() {
                    const con = prompt("Écris ton secret (Anonyme) :");
                    if (con && con.trim()) {
                        await sb.from('secrets').insert({ content: con });
                        location.reload();
                    }
                },

                async openChat(user) {
                    this.activeChat = user;
                    const { data } = await sb.from('messages')
                        .select('*')
                        .or(`and(sender_id.eq.${this.session.user.id},receiver_id.eq.${user.id}),and(sender_id.eq.${user.id},receiver_id.eq.${this.session.user.id})`)
                        .order('created_at');
                    this.messages = data || [];
                    setTimeout(() => { const el = document.getElementById('chat-box'); if(el) el.scrollTop = el.scrollHeight; }, 100);
                },

                async loadProfile() {
                    const { data } = await sb.from('profiles').select('*').eq('id', this.session.user.id).single();
                    this.profile = data;
                },

                async sendMessage() {
                    if (!this.newMessage.trim()) r
