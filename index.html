<body x-data="kelvinSoft">

    <!-- ÉCRAN AUTH -->
    <template x-if="!session">
        <div class="h-screen flex flex-col items-center justify-center p-8 text-center bg-[#FFF5F5]">
            <div class="w-20 h-20 bg-love-accent rounded-[2rem] mb-6 flex items-center justify-center shadow-lg shadow-rose-100">

            </div>

                <template x-if="mode === 'signup'">
                    <div class="space-y-4 animate-in fade-in zoom-in duration-300">

                        <input type="number" x-model="form.age" placeholder="Âge" class="w-full p-4 bg-white rounded-2xl border-none shadow-sm outline-none">
                    </div>
                </template>
                <input type="email" x-model="form.email" placeholder="Email" class="w-full p-4 bg-white rounded-2xl shadow-sm border-none outline-none">
                <input type="password" x-model="form.password" placeholder="Mot de passe" class="w-full p-4 bg-white rounded-2xl shadow-sm border-none outline-none">
                <button @click="handleAuth" class="w-full bg-love-accent text-white font-bold py-4 rounded-2xl shadow-lg active:scale-95 transition-all">Continuer</button>
                <button @click="mode = (mode === 'signup' ? 'login' : 'signup')" class="text-xs text-love-accent font-bold mt-4 underline" x-text="mode === 'signup' ? 'J\'ai déjà un compte' : 'Créer un compte'"></button>
            </div>
        </div>
    </template>

    <!-- INTERFACE PRINCIPALE -->
    <template x-if="session">
        <div class="h-screen flex flex-col relative">
            
            <!-- HEADER -->
            <header class="p-4 flex justify-between items-center bg-white border-b border-love-soft sticky top-0 z-50">
                <h1 class="text-2xl font-black text-love-accent italic tracking-tighter">Kelvin</h1>
                <div class="flex items-center gap-5 text-slate-400">
                    <iconify-icon icon="solar:magnifer-bold" width="24"></iconify-icon>
                    <button @click="showProfile = true" class="w-9 h-9 rounded-full border-2 border-love-accent overflow-hidden">
                        <img :src="'https://api.dicebear.com/7.x/adventurer/svg?seed='+profile?.full_name" class="w-full h-full">
                    </button>
                </div>
            </header>

            <!-- TABS -->
            <nav class="flex bg-white border-b border-love-soft sticky top-[73px] z-40">
                <button @click="activeTab = 'chats'" class="flex-1 py-4 text-xs font-bold uppercase tracking-widest" :class="activeTab === 'chats' ? 'tab-active' : 'text-slate-400'">Discussions</button>
                <button @click="activeTab = 'actus'" class="flex-1 py-4 text-xs font-bold uppercase tracking-widest" :class="activeTab === 'actus' ? 'tab-active' : 'text-slate-400'">Actus</button>
                <button @click="activeTab = 'campus'" class="flex-1 py-4 text-xs font-bold uppercase tracking-widest" :class="activeTab === 'campus' ? 'tab-active' : 'text-slate-400'">Campus</button>
                <button @click="activeTab = 'secrets'" class="flex-1 py-4 text-xs font-bold uppercase tracking-widest" :class="activeTab === 'secrets' ? 'tab-active' : 'text-slate-400'">Secrets</button>
            </nav>

            <main class="flex-1 overflow-y-auto pb-24">
                
                <!-- DISCUSSIONS -->
                <div x-show="activeTab === 'chats'" class="divide-y divide-love-soft">
                    <template x-for="chat in chatList" :key="chat.id">
                        <div @click="openChat(chat)" class="flex items-center gap-4 p-4 hover:bg-love-soft transition-colors cursor-pointer">
                            <div class="w-14 h-14 rounded-full bg-love-soft flex items-center justify-center border-2 border-white shadow-sm overflow-hidden">
                                <img :src="'https://api.dicebear.com/7.x/adventurer/svg?seed='+chat.full_name" class="w-full h-full">
                            </div>
                            <div class="flex-1 min-w-0">
                                <div class="flex justify-between items-center mb-1">
                                    <h3 class="font-bold text-love-text truncate" x-text="chat.full_name"></h3>
                                    <span class="text-[9px] font-bold" :class="chat.is_online ? 'text-green-500' : 'text-slate-400'" x-text="chat.is_online ? 'En ligne' : chat.last_seen_formatted"></span>
                                </div>
                                <div class="flex justify-between items-center">
                                    <p class="text-slate-400 text-xs truncate" x-text="chat.university || 'Université'"></p>
                                    <span class="text-[9px] font-black text-love-accent bg-love-soft px-2 py-0.5 rounded-full" x-text="chat.distance + ' KM'"></span>
                                </div>
                            </div>
                        </div>
                    </template>
                </div>

                <!-- ACTUS (Status) -->
                <div x-show="activeTab === 'actus'" class="p-4 grid grid-cols-2 gap-4">
                    <div class="h-60 rounded-3xl bg-love-soft border-2 border-dashed border-love-accent flex flex-col items-center justify-center text-love-accent cursor-pointer">
                        <iconify-icon icon="solar:add-circle-bold" width="32"></iconify-icon>
                        <span class="text-[10px] font-black mt-2">MON ACTU</span>
                    </div>
                    <template x-for="story in stories" :key="story.id">
                        <div class="h-60 rounded-3xl bg-slate-200 relative overflow-hidden group shadow-md">
                            <img :src="story.photo_url || 'https://picsum.photos/seed/'+story.id+'/400/600'" class="w-full h-full object-cover">
                            <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-transparent p-4 flex flex-col justify-end">
                                <p class="text-white text-[11px] font-medium leading-tight mb-2" x-text="story.caption"></p>
                                <div class="flex items-center gap-2">
                                    <button class="flex items-center gap-1 bg-white/20 backdrop-blur-md rounded-full px-2 py-1">
                                        <iconify-icon icon="solar:heart-bold" class="text-rose-500"></iconify-icon>
                                        <span class="text-white text-[10px] font-bold" x-text="story.likes_count"></span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </template>
                </div>

                <!-- SECRETS (Anonymes) -->
                <div x-show="activeTab === 'secrets'" class="p-6 space-y-4">
                    <template x-for="sec in secrets" :key="sec.id">
                        <div class="bg-white p-6 rounded-[2rem] shadow-sm border-b-4 border-love-soft transition-transform active:scale-95">
                            <p class="text-sm italic text-love-text leading-relaxed" x-text="sec.content"></p>
                            <div class="mt-4 flex items-center gap-2 opacity-30 text-[9px] font-bold uppercase tracking-tighter">
                                <iconify-icon icon="solar:mask-happly-bold"></iconify-icon>
                                <span>Secret Anonyme • Il y a peu</span>
                            </div>
                        </div>
                    </template>
                </div>

            </main>

            <!-- CHAT PRIVE OVERLAY -->
            <div x-show="activeChat" x-cloak class="fixed inset-0 bg-love-base z-[100] flex flex-col animate-in slide-in-from-right duration-300">
                <header class="p-4 bg-white border-b border-love-soft flex items-center gap-4">
                    <button @click="activeChat = null"><iconify-icon icon="solar:arrow-left-bold" width="24" class="text-love-accent"></iconify-icon></button>
                    <div class="w-10 h-10 rounded-full border-2 border-love-accent overflow-hidden">
                        <img :src="'https://api.dicebear.com/7.x/adventurer/svg?seed='+activeChat?.full_name" class="w-full h-full">
                    </div>
                    <div class="flex-1">
                        <p class="font-bold text-sm" x-text="activeChat?.full_name"></p>
                        <p class="text-[10px] font-bold" :class="activeChat?.is_online ? 'text-green-500' : 'text-slate-400'" x-text="activeChat?.is_online ? 'En ligne' : activeChat?.last_seen_formatted"></p>
                    </div>
                </header>
                <div class="flex-1 overflow-y-auto p-4 space-y-4 relative bg-[#FFFBFB]">
                    <div class="chat-pattern"></div>
                    <template x-for="m in messages" :key="m.id">
                        <div class="flex relative z-10" :class="m.sender_id === session.user.id ? 'justify-end' : 'justify-start'">
                            <div class="p-4 rounded-[2rem] text-sm max-w-[85%] shadow-sm" :class="m.sender_id === session.user.id ? 'bg-love-accent text-white rounded-tr-none' : 'bg-white text-love-text border border-love-soft rounded-tl-none'">
                                <p x-text="m.content"></p>
                                <span class="text-[8px] block mt-1 opacity-60 text-right" x-text="formatTime(m.created_at)"></span>
                            </div>
                        </div>
                    </template>
                </div>
                <div class="p-4 bg-white flex gap-3 items-center">
                    <div class="flex-1 bg-love-base rounded-full px-5 py-3 flex items-center gap-3">
                        <iconify-icon icon="solar:smile-circle-bold" class="text-slate-300" width="22"></iconify-icon>
                        <input type="text" x-model="newMessage" @keyup.enter="sendMessage" placeholder="Message..." class="bg-transparent flex-1 outline-none text-sm">
                        <iconify-icon icon="solar:paperclip-bold" class="text-slate-300" width="22"></iconify-icon>
                    </div>
                    <button @click="sendMessage" class="w-12 h-12 bg-love-accent text-white rounded-full flex items-center justify-center shadow-lg shadow-rose-100 active:scale-90 transition-all">
                        <iconify-icon icon="solar:paper-plane-bold" width="22"></iconify-icon>
                    </button>
                </div>
            </div>

            <!-- MODAL PROFIL SETTINGS -->
            <div x-show="showProfile" x-cloak class="fixed inset-0 z-[200] flex items-end">
                <div class="absolute inset-0 bg-love-text/20 backdrop-blur-sm" @click="showProfile = false"></div>
                <div class="relative w-full bg-white rounded-t-[3rem] p-8 space-y-6 shadow-2xl animate-in slide-in-from-bottom duration-300">
                    <div class="flex flex-col items-center">
                        <div class="w-28 h-28 rounded-3xl border-4 border-love-accent overflow-hidden mb-4 shadow-xl">
                            <img :src="'https://api.dicebear.com/7.x/adventurer/svg?seed='+profile?.full_name" class="w-full h-full object-cover">
                        </div>
                        <h2 class="text-2xl font-bold" x-text="profile?.full_name"></h2>
                        <span class="text-[10px] font-black text-love-accent uppercase bg-love-soft px-3 py-1 rounded-full mt-2" x-text="profile?.university || 'Étudiant'"></span>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div class="p-4 bg-love-base rounded-2xl">
                            <p class="text-[9px] font-bold text-slate-400 uppercase">WhatsApp</p>
                            <p class="text-sm font-bold truncate" x-text="profile?.phone || 'Non lié'"></p>
                        </div>
                        <div class="p-4 bg-love-base rounded-2xl">
                            <p class="text-[9px] font-bold text-slate-400 uppercase">Âge</p>
                            <p class="text-sm font-bold" x-text="(profile?.age || '20') + ' ans'"></p>
                        </div>
                        <div class="p-4 bg-love-base rounded-2xl col-span-2 flex justify-between items-center">
                            <div>
                                <p class="text-[9px] font-bold text-slate-400 uppercase">Membre depuis</p>
                                <p class="text-sm font-bold" x-text="new Date(profile?.created_at).toLocaleDateString()"></p>
                            </div>
                            <iconify-icon icon="solar:calendar-bold" class="text-love-accent text-xl"></iconify-icon>
                        </div>
                    </div>
                    <button @click="signOut" class="w-full py-4 text-red-500 font-bold border-2 border-red-50 rounded-2xl hover:bg-red-50 transition-colors">Déconnexion</button>
                </div>
            </div>

        </div>
    </template>

    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.data('kelvinSoft', () => ({
                session: null, activeTab: 'chats', activeChat: null, showProfile: false,
                mode: 'login', profile: null, chatList: [], universities: [],
                stories: [], secrets: [], messages: [], newMessage: '',
                form: { name: '', email: '', password: '', phone: '', age: '' },

                async init() {
                    const { data } = await sb.auth.getSession();
                    this.session = data.session;
                    this.fetchStories();
                    this.fetchSecrets();
                    if (this.session) {
                        await this.loadProfile();
                        this.updateOnlineStatus();
                        this.fetchChats();
                        this.listen();
                        setInterval(() => this.updateOnlineStatus(), 60000);
                    }
                },

                async handleAuth() {
                    try {
                        if (this.mode === 'signup') {
                            const { data, error } = await sb.auth.signUp({ email: this.form.email, password: this.form.password });
                            if (error) throw error;
                            await sb.from('profiles').update({ 
                                full_name: this.form.name, 
                                phone: this.form.phone,
                                age: this.form.age 
                            }).eq('id', data.user.id);
                            alert("Vérifie ton email !");
                        } else {
                            const { error } = await sb.auth.signInWithPassword({ email: this.form.email, password: this.form.password });
                            if (error) throw error;
                            location.reload();
                        }
                    } catch (e) { alert(e.message); }
                },

                async loadProfile() {
                    const { data } = await sb.from('profiles').select('*').eq('id', this.session.user.id).single();
                    this.profile = data;
                },

                async fetchStories() {
                    const { data } = await sb.from('stories').select('*').order('created_at', { ascending: false });
                    this.stories = data || [];
                },

                async fetchSecrets() {
                    const { data } = await sb.from('secrets').select('*').order('created_at', { ascending: false });
                    this.secrets = data || [];
                },

                async fetchChats() {
                    const { data } = await sb.from('profiles').select('*').neq('id', this.session.user.id);
                    this.chatList = data.map(u => ({
                        ...u,
                        distance: this.calcDist(this.profile?.latitude, this.profile?.longitude, u.latitude, u.longitude).toFixed(1),
                        is_online: (new Date() - new Date(u.last_seen)) < 300000,
                        last_seen_formatted: 'Vu à ' + new Date(u.last_seen).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})
                    }));
                },

                calcDist(lat1, lon1, lat2, lon2) {
                    if (!lat1 || !lat2) return 0;
                    const R = 6371;
                    const dLat = (lat2-lat1) * Math.PI/180;
                    const dLon = (lon2-lon1) * Math.PI/180;
                    const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLon/2)*Math.sin(dLon/2);
                    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
                },

                async updateOnlineStatus() {
                    await sb.from('profiles').update({ last_seen: new Date() }).eq('id', this.session.user.id);
                    navigator.geolocation.getCurrentPosition(async (p) => {
                        await sb.from('profiles').update({ latitude:
