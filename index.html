<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kelvin Loving | Soft Edition</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">

    <script>
        const S_URL = 'https://oemqhxmmoxykrqqhwnqq.supabase.co';
        const S_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9lbXFoeG1tb3h5a3JxcWh3bnFxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU3OTM3MzksImV4cCI6MjEwMTM2OTczOX0.F7lVdMft0gQEyGiQYrnE5BMaTcu3nxMQa8D1CX0icbQ';
        
        // Initialisation immédiate
        window.sbConn = null;
        function initSupabase() {
            if (typeof supabase !== 'undefined') {
                window.sbConn = supabase.createClient(S_URL, S_KEY);
            }
        }
        initSupabase();

        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        love: { base: '#FFF9F9', soft: '#F8E7E7', accent: '#D988B9', text: '#4A3B3B' }
                    }
                }
            }
        }
    </script>

    <style>
        [x-cloak] { display: none !important; }
        body { background-color: #FFF9F9; color: #4A3B3B; font-family: 'Outfit', sans-serif; }
        .tab-active { color: #D988B9; border-bottom: 3px solid #D988B9; }
        #loading-screen { position:fixed; inset:0; background:#FFF9F9; display:flex; align-items:center; justify-content:center; z-index:9999; }
    </style>
</head>
<body x-data="kelvinSoft">

    <!-- CHARGEMENT -->
    <div id="loading-screen">
        <iconify-icon icon="line-md:loading-twotone-loop" style="font-size:50px; color:#D988B9;"></iconify-icon>
    </div>

    <div x-cloak x-show="true">
        <!-- 1. ÉCRAN DE CONNEXION -->
        <template x-if="!session">
            <div class="h-screen flex flex-col items-center justify-center p-8 text-center">
                <div class="w-20 h-20 bg-love-accent rounded-[2rem] mb-6 flex items-center justify-center shadow-lg">
                    <iconify-icon icon="solar:heart-bold" class="text-white text-4xl"></iconify-icon>
                </div>
                <h1 class="text-3xl font-bold text-love-text mb-2">Kelvin Loving</h1>
                <p class="text-slate-400 text-sm mb-10 italic">L'amour au campus, version soft.</p>
                <div class="w-full max-w-sm space-y-4">
                    <template x-if="mode === 'signup'">
                        <div class="space-y-4">
                            <input type="text" x-model="form.name" placeholder="Nom Complet" class="w-full p-4 bg-white rounded-2xl border-none shadow-sm outline-none">
                            <input type="number" x-model="form.age" placeholder="Âge" class="w-full p-4 bg-white rounded-2xl border-none shadow-sm outline-none">
                        </div>
                    </template>
                    <input type="email" x-model="form.email" placeholder="Email" class="w-full p-4 bg-white rounded-2xl shadow-sm border-none outline-none">
                    <input type="password" x-model="form.password" placeholder="Mot de passe" class="w-full p-4 bg-white rounded-2xl shadow-sm border-none outline-none">
                    <button @click="handleAuth" class="w-full bg-love-accent text-white font-bold py-4 rounded-2xl shadow-lg active:scale-95 transition-all">
                        <span x-text="mode === 'signup' ? 'Créer un compte' : 'Se connecter'"></span>
                    </button>
                    <button @click="mode = (mode === 'signup' ? 'login' : 'signup')" class="text-xs text-love-accent font-bold mt-4 underline">
                        <span x-text="mode === 'signup' ? 'Déjà un compte ? Connecte-toi' : 'Nouveau ? Inscris-toi'"></span>
                    </button>
                </div>
            </div>
        </template>

        <!-- 2. APPLICATION -->
        <template x-if="session">
            <div class="h-screen flex flex-col">
                <header class="p-4 flex justify-between items-center bg-white border-b border-love-soft">
                    <h1 class="text-2xl font-black text-love-accent italic">Kelvin</h1>
                    <button @click="showProfile = true" class="w-10 h-10 rounded-full border-2 border-love-accent overflow-hidden">
                        <img :src="'https://api.dicebear.com/7.x/adventurer/svg?seed='+profile?.full_name" class="w-full h-full">
                    </button>
                </header>

                <nav class="flex bg-white border-b border-love-soft">
                    <button @click="activeTab = 'chats'" class="flex-1 py-4 text-[10px] font-black uppercase tracking-widest text-center" :class="activeTab === 'chats' ? 'tab-active' : 'text-slate-400'">Discussions</button>
                    <button @click="activeTab = 'actus'" class="flex-1 py-4 text-[10px] font-black uppercase tracking-widest text-center" :class="activeTab === 'actus' ? 'tab-active' : 'text-slate-400'">Actus</button>
                    <button @click="activeTab = 'campus'" class="flex-1 py-4 text-[10px] font-black uppercase tracking-widest text-center" :class="activeTab === 'campus' ? 'tab-active' : 'text-slate-400'">Campus</button>
                    <button @click="activeTab = 'secrets'" class="flex-1 py-4 text-[10px] font-black uppercase tracking-widest text-center" :class="activeTab === 'secrets' ? 'tab-active' : 'text-slate-400'">Secrets</button>
                </nav>

                <main class="flex-1 overflow-y-auto pb-24">
                    <!-- DISCUSSIONS -->
                    <div x-show="activeTab === 'chats'" class="divide-y divide-love-soft">
                        <template x-for="chat in chatList" :key="chat.id">
                            <div @click="openChat(chat)" class="flex items-center gap-4 p-4 hover:bg-love-soft/30 cursor-pointer">
                                <div class="w-14 h-14 rounded-full border-2 border-white shadow-sm overflow-hidden bg-love-soft">
                                    <img :src="'https://api.dicebear.com/7.x/adventurer/svg?seed='+chat.full_name" class="w-full h-full">
                                </div>
                                <div class="flex-1">
                                    <div class="flex justify-between"><h3 class="font-bold" x-text="chat.full_name"></h3><span class="text-[9px] text-green-500 font-bold" x-show="chat.is_online">En ligne</span></div>
                                    <p class="text-[10px] text-love-accent font-bold" x-text="chat.distance + ' KM'"></p>
                                </div>
                            </div>
                        </template>
                    </div>

                    <!-- SECRETS (Anonyme) -->
                    <div x-show="activeTab === 'secrets'" class="p-6 space-y-4">
                        <template x-for="sec in secrets" :key="sec.id">
                            <div class="bg-white p-6 rounded-[2rem] shadow-sm border-b-4 border-love-soft">
                                <p class="text-sm italic" x-text="sec.content"></p>
                                <span class="text-[9px] opacity-20 mt-4 block">🤫 Confession anonyme</span>
                            </div>
                        </template>
                    </div>
                </main>
                
                <!-- CHAT PRIVE -->
                <div x-show="activeChat" class="fixed inset-0 bg-love-base z-[100] flex flex-col">
                    <header class="p-4 bg-white border-b border-love-soft flex items-center gap-4">
                        <button @click="activeChat = null"><iconify-icon icon="solar:arrow-left-bold" width="24" class="text-love-accent"></iconify-icon></button>
                        <p class="font-bold flex-1" x-text="activeChat?.full_name"></p>
                    </header>
                    <div class="flex-1 overflow-y-auto p-4 space-y-4" id="scroller">
                        <template x-for="m in messages" :key="m.id">
                            <div class="flex" :class="m.sender_id === session.user.id ? 'justify-end' : 'justify-start'">
                                <div class="p-4 rounded-[2rem] text-sm max-w-[85%]" :class="m.sender_id === session.user.id ? 'bg-love-accent text-white rounded-tr-none' : 'bg-white text-love-text border rounded-tl-none'">
                                    <p x-text="m.content"></p>
                                </div>
                            </div>
                        </template>
                    </div>
                    <div class="p-4 bg-white flex gap-2">
                        <input type="text" x-model="newMessage" @keyup.enter="sendMessage" placeholder="Message..." class="flex-1 bg-love-base p-4 rounded-full outline-none text-sm border-none">
                        <button @click="sendMessage" class="w-14 h-14 bg-love-accent text-white rounded-full flex items-center justify-center">
                            <iconify-icon icon="solar:paper-plane-bold" width="22"></iconify-icon>
                        </button>
                    </div>
                </div>

            </div>
        </template>
    </div>

    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.data('kelvinSoft', () => ({
                session: null, activeTab: 'chats', activeChat: null, showProfile: false,
                mode: 'login', profile: null, chatList: [], universities: [],
                stories: [], secrets: [], messages: [], newMessage: '',
                form: { name: '', email: '', password: '', phone: '', age: '' },

                async init() {
                    // Supprimer le loader dès qu'Alpine démarre
                    document.getElementById('loading-screen').style.display = 'none';

                    if (!window.sbConn) initSupabase();
                    
                    const { data } = await window.sbConn.auth.getSession();
                    this.session = data.session;

                    if (this.session) {
                        await this.loadProfile();
                        this.fetchData();
                        this.listen();
                    }
                },

                async handleAuth() {
                    try {
                        if (this.mode === 'signup') {
                            const { data, error } = await window.sbConn.auth.signUp({ email: this.form.email, password: this.form.password });
                            if (error) throw error;
                            await window.sbConn.from('profiles').update({ full_name: this.form.name, age: this.form.age }).eq('id', data.user.id);
                            alert("Vérifie ton mail !");
                        } else {
                            const { error } = await window.sbConn.auth.signInWithPassword({ email: this.form.email, password: this.form.password });
                            if (error) throw error;
                            location.reload();
                        }
                    } catch (e) { alert(e.message); }
                },

                async loadProfile() {
                    const { data } = await window.sbConn.from('profiles').select('*').eq('id', this.session.user.id).single();
                    this.profile = data;
                },

                async fetchData() {
                    // On charge un par un pour éviter que tout bloque si une table manque
                    const resChat = await window.sbConn.from('profiles').select('*').neq('id', this.session.user.id);
                    if (resChat.data) {
                        this.chatList = resChat.data.map(u => ({
                            ...u,
                            distance: this.calcDist(this.profile?.latitude, this.profile?.longitude, u.latitude, u.longitude).toFixed(1),
                            is_online: (new Date() - new Date(u.last_seen)) < 300000
                        }));
                    }
                    
                    const resSec = await window.sbConn.from('secrets').select('*').limit(20);
                    if (resSec.data) this.secrets = resSec.data;
                },

                calcDist(lat1, lon1, lat2, lon2) {
                    if (!lat1 || !lat2) return 0;
                    const R = 6371;
                    const dLat = (lat2-lat1) * Math.PI/180;
                    const dLon = (lon2-lon1) * Math.PI/180;
                    const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLon/2)*Math.sin(dLon/2);
                    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
                },

                async openChat(user) {
                    this.activeChat = user;
                    const { data } = await window.sbConn.from('messages')
                        .select('*')
                        .or(`and(sender_id.eq.${this.session.user.id},receiver_id.eq.${user.id}),and(sender_id.eq.${user.id},receiver_id.eq.${this.session.user.id})`)
                        .order('created_at');
                    this.messages = data || [];
                },

                async sendMessage() {
                    if (!this.newMessage.trim()) return;
                    await window.sbConn.from('messages').insert({ sender_id: this.session.user.id, receiver_id: this.activeChat.id, content: this.newMessage });
                    this.newMessage = '';
                    this.openChat(this.activeChat);
                },

                listen() {
                    window.sbConn.channel('room1').on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, () => {
                        if(this.activeChat) this.openChat(this.activeChat);
                    }).subscribe();
                },

                async signOut() { await window.sbConn.auth.signOut(); location.reload(); }
            }));
        });
    </script>
</body>
</html>
